  const leftPortions = (id) => (s.kitchen[id] || 0) - ((reserved.meat || {})[id] || 0);
  const dLeft = (c) => r3(c.qty - ((reserved.cons || {})[c.id] || 0));
  const pending = (id) => s.requests.some((r) => r.meatId === id && r.status === 'pending');
  return html`<div>
    <div className="sec-title">Ready-made meat · sold by weight</div>
    ${rm.length ? null : html`<div className="empty">No ready-made prices set yet. An admin can add them in Settings → Prices → Ready-made.</div>`}
    <div className="meat-grid">
      ${rm.map((m) => {
        const l = leftPortions(m.id);
        const out = l < 1;
        return html`<div key=${m.id} className=${'meat-card' + (out ? ' out' : '')}>
          <div className="mc-top">
            <span className="mc-emoji">${m.emoji}</span>
            <div><div className="mc-name">${m.name}</div><div className="mc-sub">1 kg ${money(m.readyPortions[1] || 0)}</div></div>
            <span className=${'pill ' + (l < 0 ? 'danger' : out ? 'warn' : l <= (m.readyLow || 0) ? 'warn' : 'ok')}>${l < 0 ? -l + ' portions owed' : out ? 'Recorded as out' : portionsLabel(grams, l) + ' left'}</span>
          </div>
          <div className="portion-row">
            ${FRACS.map((f) => html`<button key=${f} className="portion" onClick=${() => onAdd(readyMeatLine(m, f, grams))}><b>${FRAC_LABEL[f]}</b><span>${money(m.readyPortions[f] || 0)}</span></button>`)}
          </div>
          ${out ? html`<p className="hint" style=${{ margin: '2px 0' }}>You can still sell — the transfer just hasn't been logged yet.</p>` : null}
          <button className="btn ghost sm" disabled=${pending(m.id)} onClick=${() => setReqFor(m)}>${pending(m.id) ? 'Requested · waiting for butchery' : 'Request meat from butchery'}</button>
        </div>`;
      })}
    </div>
    ${reqFor ? html`<${RequestQtyModal} meat=${reqFor} onClose=${() => setReqFor(null)} />` : null}
    <div className="sec-title mt">Sides</div>
    ${sides.length ? null : html`<div className="empty">No sides yet. Add them in Settings → Prices → Sides.</div>`}
    <div className="chips">${sides.map((x) => html`<button key=${x.id} className="chip" onClick=${() => onAdd(sideLine(x))}>${x.name}<small>${money(x.price)}</small></button>`)}</div>
    <div className="sec-title mt">Drinks</div>
    ${drinks.length ? null : html`<div className="empty">No drinks with a price yet. Add them in Settings → Prices → Drinks.</div>`}
    <div className="chips">${drinks.map((c) => html`<button key=${c.id} className="chip" disabled=${dLeft(c) < 1} onClick=${() => onAdd(drinkLine(c))}>${c.name}<small>${money(c.price)}</small></button>`)}</div>
  </div>`;
}

const Fragment = React.Fragment;

/* ---------------- stock modal: receive / waste / transfer ---------------- */
function StockModal({ type, meat, onClose }) {
  const { s: st0, update, notify, user } = useApp();
  const m = meat;
  const grams = st0.settings.portionGrams || 250;
  const [qty, setQty] = useState('');
  const [cost, setCost] = useState('');
  const [supplierId, setSupplierId] = useState('');
  const [method, setMethod] = useState('cash');
  const [reason, setReason] = useState(WASTE_REASONS[0]);
  const [loc, setLoc] = useState('butchery');
  const wasteUnit = type === 'waste' && loc === 'kitchen' ? 'portions' : m.kind === 'bird' ? 'birds' : 'kg';
  const unit = type === 'waste' ? wasteUnit : m.kind === 'bird' ? 'birds' : 'kg';
  const titles = { receive: 'Receive ' + m.name + ' into butchery', waste: 'Record waste · ' + m.name, transfer: 'Take ' + m.name + ' to the kitchen' };
  const go = () => {
    const q = num(qty);
    if (!(q > 0)) { notify('Enter a quantity above zero', 'err'); return; }
    let err = null;
    update((d) => {
      if (type === 'receive') receiveMeat(d, m.id, q, num(cost), supplierId || null, supplierId ? method : 'cash', user.name);
      else if (type === 'waste') err = recordWaste(d, { loc, meatId: m.id, qty: loc === 'kitchen' ? Math.round(q) : q, reason, by: user.name });
      else err = transferToKitchen(d, m.id, q, user.name, 'morning');
    });
    if (err) { notify(err, 'err'); return; }
    notify(type === 'receive' ? 'Stock received' : type === 'waste' ? 'Waste recorded' : q + ' kg of ' + m.name + ' moved to the kitchen');
    onClose();
  };
  return html`<${Modal} title=${titles[type]} onClose=${onClose} footer=${html`<button className="btn ghost" onClick=${onClose}>Cancel</button><button className="btn" onClick=${go}>${type === 'receive' ? 'Add to stock' : type === 'waste' ? 'Record waste' : 'Move to kitchen'}</button>`}>
    <div className="col">
      ${type === 'transfer' ? html`<p className="hint">Send any amount to the kitchen — it's converted into ${grams}g portions automatically. Butchery has ${r3(m.stock)} kg of ${m.name} right now.</p>` : null}
      ${type === 'waste' && m.kind === 'kg' ? html`<${Field} label="Where was it lost?"><select className="inp" value=${loc} onChange=${(e) => setLoc(e.target.value)}><option value="butchery">Butchery (${r3(m.stock)} kg)</option><option value="kitchen">Kitchen ready-made (${portionsLabel(grams, st0.kitchen[m.id] || 0)})</option></select><//>` : null}
      <${Field} label=${'Quantity (' + unit + ')'}><input className="inp num" type="number" inputMode="decimal" step=${loc === 'kitchen' && type === 'waste' ? '1' : 'any'} value=${qty} onChange=${(e) => setQty(e.target.value)} autoFocus /><//>
      ${type === 'receive' ? html`
        <${Field} label="Total amount paid (KSh)" sub="Used to update the average buying cost, which drives your profit figures."><input className="inp num" type="number" inputMode="decimal" value=${cost} onChange=${(e) => setCost(e.target.value)} /><//>
        <${Field} label="Supplier (optional)"><select className="inp" value=${supplierId} onChange=${(e) => setSupplierId(e.target.value)}><option value="">No supplier on file</option>${st0.suppliers.map((x) => html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//>
        ${supplierId ? html`<${Field} label="How is this being paid?"><select className="inp" value=${method} onChange=${(e) => setMethod(e.target.value)}><option value="cash">Paid now · cash</option><option value="mpesa">Paid now · M-Pesa</option><option value="credit">On credit · added to supplier balance</option></select><//>` : null}` : null}
      ${type === 'waste' ? html`<${Field} label="Reason"><select className="inp" value=${reason} onChange=${(e) => setReason(e.target.value)}>${WASTE_REASONS.map((r) => html`<option key=${r}>${r}</option>`)}</select><//>` : null}
    </div>
  <//>`;
}

/* ---------------- BUTCHERY ---------------- */
function ButcherySell() {
  const { s, update, notify, user, showReceipt } = useApp();
  const [sel, setSel] = useState(null);
  const [cart, setCart] = useState([]);
  const [kg, setKg] = useState('');
  const [amt, setAmt] = useState('');
  const [payOpen, setPayOpen] = useState(false);
  const meats = activeMeats(s).filter((x) => x.butchery > 0);
  const m = meats.find((x) => x.id === sel);
  const inCart = (id) => sum(cart.filter((l) => l.mid === id), (l) => l.qty);
  const avail = (mm) => r3(mm.stock - inCart(mm.id));
  const total = sum(cart, (l) => l.total);
  const add = (mm, qty, tot, label) => {
    if (!(qty > 0)) { notify('Enter a quantity', 'err'); return; }
    if (qty > avail(mm) + 1e-9) { notify('Only ' + r3(avail(mm)) + (mm.kind === 'bird' ? ' birds' : ' kg') + ' of ' + mm.name + ' left', 'err'); return; }
    setCart((c) => c.concat([{ key: 'b-' + uid(), kind: 'meat', ch: 'butchery', mid: mm.id, name: mm.name, label, qty, unit: mm.kind === 'bird' ? 'bird' : 'kg', total: tot, cost: r2(mm.cost * qty), deduct: [{ loc: 'butchery', id: mm.id, qty }] }]));
    setKg(''); setAmt('');
  };
  const confirm = (pay, doPrint, customer) => {
    const res = update((d) => {
      const err = checkStock(d, cart.flatMap((l) => l.deduct));
      if (err) return { err };
      return { sale: createSale(d, { source: 'butchery', lines: cart, pay, cashier: user.name, customer }) };
    });
    if (res.err) { notify(res.err, 'err'); return; }
    setCart([]); setPayOpen(false); setSel(null);
    notify(pay ? 'Sale complete · ' + money(res.sale.total) : 'Sold on credit to ' + res.sale.customer.name);
    if (doPrint) showReceipt(res.sale, true);
  };
  const kgQty = num(kg), amtNum = Math.round(num(amt));
  return html`<div className="split">
    <div>
      <p className="hint">Raw meat only. Beef, goat and pork sell in ¼, ½, ¾ or 1 kg, by custom weight, or by amount in ${CUR}. Chicken sells as a full or half bird.</p>
      ${meats.length ? null : html`<div className="empty">No butchery prices set. An admin can add them in Settings → Prices → Butchery.</div>`}
      <div className="meat-grid">
        ${meats.map((mm) => {
          const a = avail(mm);
          return html`<button key=${mm.id} className=${'meat-card' + (sel === mm.id ? ' sel' : '')} onClick=${() => { setSel(mm.id); setKg(''); setAmt(''); }} disabled=${a <= 0}>
            <div className="mc-top">
              <span className="mc-emoji">${mm.emoji}</span>
              <div><div className="mc-name">${mm.name}</div><div className="mc-sub">${mm.kind === 'bird' ? 'Full ' + money(mm.butcheryPortions.full) + ' · Half ' + money(mm.butcheryPortions.half) : money(mm.butchery) + ' / kg'}</div></div>
              <span className=${'pill ' + (a <= 0 ? 'danger' : a <= mm.low ? 'warn' : 'ok')}>${a <= 0 ? 'Out' : r3(a) + (mm.kind === 'bird' ? ' birds' : ' kg')}</span>
            </div>
          </button>`;
        })}
      </div>
      ${m ? html`<div className="qty-panel">
        <h4>${m.emoji} ${m.name}</h4>
        ${m.kind === 'bird' ? html`
          <div className="portion-row" style=${{ gridTemplateColumns: '1fr 1fr' }}>
            <button className="portion" disabled=${avail(m) < 1} onClick=${() => add(m, 1, m.butcheryPortions.full, 'Full bird')}><b>Full bird</b><span>${money(m.butcheryPortions.full)}</span></button>
            <button className="portion" disabled=${avail(m) < 0.5} onClick=${() => add(m, 0.5, m.butcheryPortions.half, 'Half bird')}><b>Half bird</b><span>${money(m.butcheryPortions.half)}</span></button>
          </div>` : html`
          <div className="portion-row">
            ${FRACS.map((f) => html`<button key=${f} className="portion" disabled=${avail(m) + 1e-9 < f} onClick=${() => add(m, f, m.butcheryPortions[f] || 0, FRAC_LABEL[f])}><b>${FRAC_LABEL[f]}</b><span>${money(m.butcheryPortions[f] || 0)}</span></button>`)}
          </div>
          <div className="or">or</div>
          <div className="fgrid">
            <${Field} label="Custom weight (kg)" sub=${kgQty > 0 ? money(Math.round(m.butchery * kgQty)) : 'For example 1.5'}>
              <div className="row"><input className="inp num" type="number" inputMode="decimal" step="0.05" value=${kg} onChange=${(e) => setKg(e.target.value)} /><button className="btn soft" onClick=${() => add(m, kgQty, Math.round(m.butchery * kgQty), r3(kgQty) + ' kg')}>Add</button></div>
            <//>
            <${Field} label=${'By amount (' + CUR + ')'} sub=${amtNum > 0 ? '= ' + r3(amtNum / m.butchery) + ' kg' : 'Customer says how much to spend'}>
              <select className="inp" value="" onChange=${(e) => { if (e.target.value) setAmt(e.target.value); }} style=${{ marginBottom: '6px' }}>
                <option value="">Quick amount…</option>
                ${[100, 200, 500, 1000].map((v) => html`<option key=${v} value=${v}>${money(v)}</option>`)}
              </select>
              <div className="row"><input className="inp num" type="number" inputMode="decimal" placeholder="Or type amount" value=${amt} onChange=${(e) => setAmt(e.target.value)} /><button className="btn soft" onClick=${() => add(m, r3(amtNum / m.butchery), amtNum, money(amtNum) + ' → ' + r3(amtNum / m.butchery) + ' kg')}>Add</button></div>
            <//>
          </div>`}
      </div>` : null}
    </div>
    <div className="card stick">
      <div className="card-head"><h3>Sale</h3>${cart.length ? html`<button className="btn ghost sm" onClick=${() => setCart([])}>Clear</button>` : null}</div>
      <${CartList} lines=${cart} setLines=${setCart} empty="Pick a meat, then a portion" />
      <div className="total-row"><span className="sec">Total</span><b>${money(total)}</b></div>
      <button className="btn lg block mt" disabled=${!cart.length} onClick=${() => setPayOpen(true)}>Take payment</button>
    </div>
    ${payOpen ? html`<${CheckoutModal} title="Butchery payment" total=${total} print="ask" creditCustomer=${true} onClose=${() => setPayOpen(false)} onConfirm=${confirm} />` : null}
  </div>`;
}

function ButcheryStock() {
  const { s, update, notify, user } = useApp();
  const [modal, setModal] = useState(null);
  const [qtys, setQtys] = useState({});
  const pending = s.requests.filter((r) => r.status === 'pending');
  const today = dayStr();
  const fulfil = (r) => {
    const q = qtys[r.id] !== undefined ? num(qtys[r.id]) : r.qty;
    const res = update((d) => {
      const err = transferToKitchen(d, r.meatId, q, user.name, 'request');
      if (err) return err;
      const rq = d.requests.find((x) => x.id === r.id);
      rq.status = 'done'; rq.doneAt = new Date().toISOString(); rq.sent = q;
      return null;
    });
    if (res) notify(res, 'err'); else notify('Sent ' + q + ' kg of ' + r.name + ' to the kitchen');
  };
  const moves = [].concat(
    s.transfers.filter((x) => x.day === today).map((x) => ({ at: x.at, t: x.type === 'special' ? 'To kitchen · special order' : x.type === 'request' ? 'To kitchen · chef request' : 'To kitchen · morning', n: x.name, q: x.qty + ' kg', by: x.by })),
    s.purchases.filter((x) => x.day === today && x.kind === 'meat').map((x) => ({ at: x.at, t: 'Received', n: x.name, q: x.qty + '', by: x.by })),
    s.waste.filter((x) => x.day === today && x.loc !== 'cons').map((x) => ({ at: x.at, t: 'Waste · ' + x.reason, n: x.name, q: x.qty + ' ' + (x.unit === 'bird' ? 'birds' : 'kg'), by: x.by }))
  ).sort((a, b) => b.at.localeCompare(a.at));
  const modalMeat = modal ? meatOf(s, modal.meatId) : null;
  return html`<div className="col" style=${{ gap: '16px' }}>
    ${pending.length ? html`<div className="card">
      <div className="card-head"><h3>Kitchen requests <span className="pill warn">${pending.length} waiting</span></h3></div>
      <div className="col gap-sm">${pending.map((r) => html`<div className="row wrap" key=${r.id}>
        <b>${r.name}</b><span className="muted">asked by ${r.by} at ${timeStr(r.at)}</span><span className="grow"></span>
        <input className="inp num" style=${{ width: '90px' }} type="number" step="any" value=${qtys[r.id] !== undefined ? qtys[r.id] : r.qty} onChange=${(e) => { const v = e.target.value; setQtys((o) => Object.assign({}, o, { [r.id]: v })); }} />
        <span className="muted">kg</span>
        <button className="btn sm" onClick=${() => fulfil(r)}>Send to kitchen</button>
      </div>`)}</div>
    </div>` : null}
    <div className="tbl-wrap"><table className="tbl">
      <thead><tr><th>Meat</th><th className="r">In butchery</th><th className="r">Avg buying cost</th><th className="r">Sells at</th><th>Status</th><th></th></tr></thead>
      <tbody>${s.meats.filter((x) => x.active !== false).map((m) => html`<tr key=${m.id}>
        <td><b>${m.emoji} ${m.name}</b></td>
        <td className="r num-strong">${r3(m.stock)} ${m.kind === 'bird' ? 'birds' : 'kg'}</td>
        <td className="r">${money(m.cost)} / ${m.kind === 'bird' ? 'bird' : 'kg'}</td>
        <td className="r">${money(m.butchery)} / ${m.kind === 'bird' ? 'bird' : 'kg'}</td>
        <td>${m.stock <= 0 ? html`<span className="pill danger">Out of stock</span>` : m.stock <= m.low ? html`<span className="pill warn">Low</span>` : html`<span className="pill ok">OK</span>`}</td>
        <td className="right"><div className="row wrap" style=${{ justifyContent: 'flex-end' }}>
          <button className="btn soft sm" onClick=${() => setModal({ type: 'receive', meatId: m.id })}>Receive</button>
          ${m.kind === 'kg' ? html`<button className="btn soft sm" onClick=${() => setModal({ type: 'transfer', meatId: m.id })}>To kitchen</button>` : null}
          <button className="btn ghost sm" onClick=${() => setModal({ type: 'waste', meatId: m.id })}>Waste</button>
        </div></td>
      </tr>`)}</tbody>
    </table></div>
    <div className="card">
      <div className="card-head"><h3>Today's stock movements</h3></div>
      ${moves.length ? html`<div className="tbl-wrap" style=${{ border: 0 }}><table className="tbl"><thead><tr><th>Time</th><th>Movement</th><th>Meat</th><th className="r">Qty</th><th>By</th></tr></thead>
        <tbody>${moves.map((x, i) => html`<tr key=${i}><td>${timeStr(x.at)}</td><td>${x.t}</td><td>${x.n}</td><td className="r">${x.q}</td><td>${x.by}</td></tr>`)}</tbody></table></div>` : html`<div className="empty">No stock movements yet today</div>`}
    </div>
    ${modal && modalMeat ? html`<${StockModal} type=${modal.type} meat=${modalMeat} onClose=${() => setModal(null)} />` : null}
  </div>`;
}

function ButcheryPage() {
  return html`<${ButcherySell} />`;
}

function KitchenStockModal({ type, onClose }) {
  const { s, update, notify, user } = useApp();
  const rm = readyMeats(s);
  const grams = s.settings.portionGrams || 250;
  const [meatId, setMeatId] = useState(rm[0] ? rm[0].id : '');
  const [qty, setQty] = useState('');
  const [reason, setReason] = useState(WASTE_REASONS[0]);
  const m = meatOf(s, meatId);
  const go = () => {
    const q = num(qty);
    if (!m) { notify('Pick a meat', 'err'); return; }
    if (!(q > 0)) { notify('Enter a quantity above zero', 'err'); return; }
    let err = null;
    update((d) => {
      if (type === 'transfer') err = transferToKitchen(d, meatId, q, user.name, 'morning');
      else err = recordWaste(d, { loc: 'kitchen', meatId, qty: Math.round(q), reason, by: user.name });
    });
    if (err) { notify(err, 'err'); return; }
    notify(type === 'transfer' ? q + ' kg of ' + m.name + ' moved to the kitchen' : 'Waste recorded');
    onClose();
  };
  return html`<${Modal} title=${type === 'transfer' ? 'Take meat from the butchery' : 'Record kitchen waste'} onClose=${onClose} footer=${html`<button className="btn ghost" onClick=${onClose}>Cancel</button><button className="btn" onClick=${go}>${type === 'transfer' ? 'Move to kitchen' : 'Record waste'}</button>`}>
    <div className="col">
      ${type === 'transfer' ? html`<p className="hint">Move any amount from the butchery to the kitchen — it's automatically converted into ${grams}g portions.</p>` : null}
      <${Field} label="Meat"><select className="inp" value=${meatId} onChange=${(e) => setMeatId(e.target.value)}>${rm.map((x) => html`<option key=${x.id} value=${x.id}>${x.name} · butchery ${r3(x.stock)} kg · kitchen ${portionsLabel(grams, s.kitchen[x.id] || 0)}</option>`)}</select><//>
      <${Field} label=${type === 'transfer' ? 'Quantity (kg)' : 'Quantity (portions)'}><input className="inp num" type="number" inputMode="decimal" step=${type === 'transfer' ? 'any' : '1'} value=${qty} onChange=${(e) => setQty(e.target.value)} /><//>
      ${type === 'waste' ? html`<${Field} label="Reason"><select className="inp" value=${reason} onChange=${(e) => setReason(e.target.value)}>${WASTE_REASONS.map((r) => html`<option key=${r}>${r}</option>`)}</select><//>` : null}
    </div>
  <//>`;
}

/* ---------------- KITCHEN · specials ---------------- */
function SpecialForm({ tableNo, onDone }) {
  const { s, update, notify, user, showReceipt } = useApp();
  const meats = activeMeats(s).filter((x) => x.special > 0);
  const [meatId, setMeatId] = useState('');
  const [qty, setQty] = useState(0);
  const [custom, setCustom] = useState('');
  const [style, setStyle] = useState('');
  const [sides, setSides] = useState({});
  const [picked, setPicked] = useState([]);
  const [extra, setExtra] = useState('');
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [tbl, setTbl] = useState(tableNo ? String(tableNo) : '');
  const [when, setWhen] = useState('later');
  const [deposit, setDeposit] = useState('');
  const [payOpen, setPayOpen] = useState(false);
  const m = meats.find((x) => x.id === meatId);
  const sideList = s.sides.filter((x) => x.active !== false);
  const sideArr = Object.keys(sides).filter((k) => sides[k] > 0).map((k) => ({ id: k, qty: sides[k] }));
  const sidesTotal = sum(sideArr, (x) => { const sd = s.sides.find((y) => y.id === x.id); return sd ? sd.price * x.qty : 0; });
  const meatTotal = m && qty > 0 ? specialPrice(m, qty) : 0;
  const price = meatTotal + sidesTotal;
  const onTable = !!tbl;
  const setSide = (id, d) => setSides((o) => Object.assign({}, o, { [id]: Math.max(0, (o[id] || 0) + d) }));
  const pickMeat = (id) => { setMeatId(id); setQty(0); setCustom(''); };
  const reset = () => { setMeatId(''); setQty(0); setCustom(''); setStyle(''); setSides({}); setPicked([]); setExtra(''); setName(''); setPhone(''); if (!tableNo) setTbl(''); setWhen('later'); setDeposit(''); };
  const togglePick = (x) => setPicked((o) => (o.includes(x) ? o.filter((y) => y !== x) : o.concat([x])));
  const depAmt = num(deposit);
  const create = (pay, doPrint) => {
    const instr = picked.concat(extra.trim() ? [extra.trim()] : []).join(', ');
    const form = { meatId, qty, style, sides: sideArr, instr, customer: name, phone, tableNo: tbl ? Number(tbl) : null };
    const amt = when === 'deposit' ? depAmt : null;
    const res = update((d) => {
      const r = createSpecial(d, form, user.name);
      if (r.err) return r;
      const sale = pay ? paySpecial(d, r.sp.id, pay, user.name, amt) : null;
      return { sp: r.sp, sale };
    });
    if (res.err) { notify(res.err, 'err'); return; }
    setPayOpen(false); reset();
    notify('Special #' + res.sp.no + ' created · ready by ' + timeStr(res.sp.due));
    if (res.sale && doPrint) showReceipt(res.sale, true);
    if (onDone) onDone(res.sp);
  };
  const submit = () => {
    if (!m) { notify('Pick a meat first', 'err'); return; }
    if (!(qty > 0)) { notify('Choose the quantity', 'err'); return; }
    if (qty > m.stock + 1e-9) { notify('Butchery only has ' + r3(m.stock) + (m.kind === 'bird' ? ' birds' : ' kg') + ' of ' + m.name, 'err'); return; }
    if (when === 'deposit' && !onTable) {
      if (!(depAmt > 0) || depAmt >= price) { notify('Enter a deposit between 0 and the order total', 'err'); return; }
      setPayOpen(true); return;
    }
    if (when === 'now' && !onTable) { setPayOpen(true); return; }
    create(null, false);
  };
  const qtyChips = m && m.kind === 'bird' ? [[1, 'Full bird'], [0.5, 'Half bird']] : [[0.25, '¼ kg'], [0.5, '½ kg'], [0.75, '¾ kg'], [1, '1 kg'], [1.5, '1½ kg'], [2, '2 kg']];
  return html`<div className="col" style=${{ gap: '16px' }}>
    <div className="card">
      <h3>1 · Meat and quantity</h3>
      ${meats.length ? null : html`<div className="empty">No specials prices set. An admin can add them in Settings → Prices → Specials.</div>`}
      <div className="chips mb">${meats.map((x) => html`<button key=${x.id} className=${'chip' + (meatId === x.id ? ' on' : '')} onClick=${() => pickMeat(x.id)}>${x.emoji} ${x.name}<small>${money(x.special)}/${x.kind === 'bird' ? 'bird' : 'kg'}</small></button>`)}</div>
      ${m ? html`<div className="row wrap">
        <div className="chips">${qtyChips.map((q) => html`<button key=${q[0]} className=${'chip' + (qty === q[0] && !custom ? ' on' : '')} disabled=${q[0] > m.stock + 1e-9} onClick=${() => { setQty(q[0]); setCustom(''); }}>${q[1]}</button>`)}</div>
        ${m.kind === 'kg' ? html`<input className="inp num" style=${{ width: '130px' }} type="number" inputMode="decimal" step="0.05" placeholder="Other kg" value=${custom} onChange=${(e) => { setCustom(e.target.value); setQty(num(e.target.value)); }} />` : null}
        <span className="muted">${r3(m.stock)} ${m.kind === 'bird' ? 'birds' : 'kg'} in butchery</span>
      </div>` : null}
    </div>
    <div className="card">
      <h3>2 · How they want it cooked</h3>
      <div className="chips mb">${s.styles.map((x) => html`<button key=${x} className=${'chip' + (style === x ? ' on' : '')} onClick=${() => setStyle(style === x ? '' : x)}>${x}</button>`)}</div>
      <${Field} label="Cooking style (or type your own)"><input className="inp" value=${style} onChange=${(e) => setStyle(e.target.value)} placeholder="e.g. Choma" /><//>
      <div className="sec-title mt">Sides</div>
      <div className="chips">${sideList.map((x) => {
        const q = sides[x.id] || 0;
        return html`<span key=${x.id} className=${'chip side-pick' + (q ? ' on' : '')} style=${{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: 0, overflow: 'hidden' }}>
          <button className="side-main" onClick=${() => setSide(x.id, 1)} aria-label=${'Add ' + x.name} style=${{ background: 'transparent', border: 0, color: 'inherit', padding: '7px 6px 7px 13px', font: 'inherit', cursor: 'pointer' }}>${x.name}<small>${money(x.price)}</small></button>
          ${q ? html`<span className="stepper" style=${{ background: '#00000030', borderRadius: 0, border: 0 }}><button onClick=${() => setSide(x.id, -1)} aria-label=${'Less ' + x.name}>−</button><span>${q}</span><button onClick=${() => setSide(x.id, 1)} aria-label=${'More ' + x.name}>+</button></span>` : html`<span style=${{ width: '7px' }}></span>`}
        </span>`;
      })}</div>
      <p className="hint" style=${{ margin: '6px 0 0' }}>Tap a side to add it — tap again for more, or use − / + once it's added.</p>
      <div className="sec-title mt">Special instructions</div>
      <div className="chips">${s.instructions.map((x) => html`<button key=${x} className=${'chip' + (picked.includes(x) ? ' on' : '')} onClick=${() => togglePick(x)}>${x}</button>`)}</div>
      <div className="mt"><${Field} label="Anything else (optional)"><input className="inp" value=${extra} onChange=${(e) => setExtra(e.target.value)} placeholder="Only if it's not covered above" /><//></div>
    </div>
    <div className="card">
      <h3>3 · Customer and payment</h3>
      <div className="fgrid">
        <${Field} label="Customer name (optional)"><input className="inp" value=${name} onChange=${(e) => setName(e.target.value)} /><//>
        <${Field} label="Phone number (optional)"><input className="inp" type="tel" value=${phone} onChange=${(e) => setPhone(e.target.value)} /><//>
        ${tableNo ? null : html`<${Field} label="Table (optional)" sub="If set, the special is added to that table's bill"><select className="inp" value=${tbl} onChange=${(e) => setTbl(e.target.value)}><option value="">No table · walk-in / takeaway</option>${Array.from({ length: s.settings.tables }, (_, i) => html`<option key=${i} value=${i + 1}>Table ${i + 1}</option>`)}</select><//>`}
      </div>
      ${onTable ? html`<p className="hint mt">This special will be added to Table ${tbl}'s bill and paid when the table settles.</p>` : html`
        <div className="sec-title mt">Payment</div>
        <div className="chips"><button className=${'chip' + (when === 'later' ? ' on' : '')} onClick=${() => setWhen('later')}>Pay later · mark unpaid</button><button className=${'chip' + (when === 'now' ? ' on' : '')} onClick=${() => setWhen('now')}>Pay in full now</button><button className=${'chip' + (when === 'deposit' ? ' on' : '')} onClick=${() => setWhen('deposit')}>Take a deposit</button></div>
        ${when === 'deposit' ? html`<div className="mt" style=${{ maxWidth: '220px' }}><${Field} label=${'Deposit amount (' + CUR + ')'} sub=${depAmt > 0 && depAmt < price ? 'Balance after: ' + money(price - depAmt) : ''}><input className="inp num" type="number" inputMode="decimal" value=${deposit} onChange=${(e) => setDeposit(e.target.value)} /><//></div>` : null}`}
    </div>
    <div className="card row wrap between">
      <div><div className="muted">${m && qty > 0 ? qtyLabel(qty, m.kind === 'bird' ? 'bird' : 'kg') + ' ' + m.name : 'Order total'}${sidesTotal ? ' + sides' : ''}</div><b style=${{ fontSize: '24px' }}>${money(price)}</b></div>
      <button className="btn lg" onClick=${submit}>${onTable ? 'Add to table bill' : when === 'now' ? 'Take payment & send to kitchen' : when === 'deposit' ? 'Take deposit & send to kitchen' : 'Send to kitchen (unpaid)'}</button>
    </div>
    <p className="hint">The exact quantity is taken out of butchery stock as soon as you send the order. Preparation takes about one hour. Every order — paid, deposited or unpaid — gets a receipt showing its status.</p>
    ${payOpen ? html`<${CheckoutModal} title=${when === 'deposit' ? 'Take deposit' : 'Special order payment'} total=${when === 'deposit' ? depAmt : price} print="ask" onClose=${() => setPayOpen(false)} onConfirm=${create} />` : null}
  </div>`;
}

/* ---------------- KITCHEN · specials register ---------------- */
function SpecialsRegister() {
  const { s, update, notify, user, showReceipt } = useApp();
  const now = useNow(30000);
  const [filter, setFilter] = useState('active');
  const [q, setQ] = useState('');
  const [payFor, setPayFor] = useState(null);
  const today = dayStr();
  let list = s.specials.slice().sort((a, b) => b.at.localeCompare(a.at));
  if (filter === 'active') list = list.filter((x) => !x.cleared);
  else if (filter === 'unpaid') list = list.filter((x) => !x.paid);
  else if (filter === 'cleared') list = list.filter((x) => x.cleared);
  const term = q.trim().toLowerCase();
  if (term) list = list.filter((x) => (x.customer + ' ' + x.phone + ' ' + x.meat + ' ' + x.instr + ' #' + x.no).toLowerCase().indexOf(term) >= 0);
  const NEXT_STATUS = { pending: 'preparing', preparing: 'ready', ready: 'served' };
  const STATUS_ACTION = { pending: 'Start preparing', preparing: 'Mark ready', ready: 'Mark served' };
  const advance = (sp) => update((d) => { const x = d.specials.find((y) => y.id === sp.id); x.status = NEXT_STATUS[x.status] || x.status; });
  const clear = (sp) => { update((d) => { d.specials.find((y) => y.id === sp.id).cleared = true; }); notify('Order #' + sp.no + ' cleared'); };
  const pay = (p, doPrint) => {
    const sale = update((d) => paySpecial(d, payFor.id, p, user.name, null));
    setPayFor(null);
    if (sale) { notify('Order #' + payFor.no + ' balance cleared'); if (doPrint) showReceipt(sale, true); }
  };
  const reprint = (sp) => { const sale = s.sales.find((x) => x.id === sp.saleId); if (sale) showReceipt(sale, false); };
  const counts = { active: s.specials.filter((x) => !x.cleared).length, unpaid: s.specials.filter((x) => !x.paid).length };
  return html`<div>
    <div className="row wrap between mb">
      <${Tabs} value=${filter} onChange=${setFilter} tabs=${[{ id: 'active', label: 'Active', badge: counts.active || null }, { id: 'unpaid', label: 'Unpaid', badge: counts.unpaid || null }, { id: 'cleared', label: 'Cleared' }, { id: 'all', label: 'All' }]} />
      <input className="inp" style=${{ width: '260px', maxWidth: '100%' }} placeholder="Search name, phone, meat, order #" value=${q} onChange=${(e) => setQ(e.target.value)} />
    </div>
    <p className="hint">Order numbers restart at 1 every day. Once an order is served and paid, clear it from the register.</p>
    ${list.length ? html`<div className="tbl-wrap"><table className="tbl">
      <thead><tr><th>Order</th><th>Customer</th><th>Order details</th><th>Table</th><th className="r">Amount</th><th>Status</th><th>Payment</th><th></th></tr></thead>
      <tbody>${list.map((sp) => {
        const overdue = sp.status === 'preparing' && now > new Date(sp.due).getTime();
        const canClear = sp.status === 'served' && sp.paid && !sp.cleared;
        return html`<tr key=${sp.id} className=${sp.cleared ? 'dim' : ''}>
          <td><b>#${sp.no}</b><div className="muted" style=${{ fontSize: '11.5px' }}>${sp.day === today ? timeStr(sp.at) : dateNice(sp.day) + ' ' + timeStr(sp.at)}</div></td>
          <td>${sp.customer || html`<span className="muted">—</span>`}<div className="muted" style=${{ fontSize: '11.5px' }}>${sp.phone}</div></td>
          <td style=${{ minWidth: '230px' }}><b>${qtyLabel(sp.qty, sp.unit)} ${sp.meat}</b>${sp.style ? ' · ' + sp.style : ''}
            ${sp.sides.length ? html`<div className="sec" style=${{ fontSize: '12.5px' }}>${sp.sides.map((x) => x.name + (x.qty > 1 ? ' ×' + x.qty : '')).join(', ')}</div>` : null}
            ${sp.instr ? html`<div className="muted" style=${{ fontSize: '12.5px', fontStyle: 'italic' }}>${sp.instr}</div>` : null}</td>
          <td>${sp.tableNo ? 'Table ' + sp.tableNo : '—'}</td>
          <td className="r num-strong">${money(sp.price)}${sp.paidAmount > 0 && sp.paidAmount < sp.price ? html`<div className="muted" style=${{ fontSize: '11.5px', fontWeight: 400 }}>paid ${money(sp.paidAmount)}</div>` : null}</td>
          <td>${sp.status === 'served' ? html`<span className="pill ok">Served</span>` : sp.status === 'ready' ? html`<span className="pill info">Ready</span>` : sp.status === 'preparing' ? (overdue ? html`<span className="pill danger">Overdue · was due ${timeStr(sp.due)}</span>` : html`<span className="pill warn">Preparing · ready by ${timeStr(sp.due)}</span>`) : html`<span className="pill">Pending</span>`}</td>
          <td>${sp.paid ? html`<span className="pill ok">Paid</span>` : sp.paidAmount > 0 ? html`<span className="pill warn">Deposit · ${money(sp.price - sp.paidAmount)} due</span>` : html`<span className="pill danger">Unpaid</span>`}</td>
          <td><div className="row wrap" style=${{ justifyContent: 'flex-end' }}>
            ${sp.status !== 'served' ? html`<button className="btn soft sm" onClick=${() => advance(sp)}>${STATUS_ACTION[sp.status]}</button>` : null}
            ${!sp.paid && !sp.tableNo ? html`<button className="btn good sm" onClick=${() => setPayFor(sp)}>Clear balance</button>` : null}
            ${!sp.paid && sp.tableNo ? html`<span className="muted" style=${{ fontSize: '12px' }}>On Table ${sp.tableNo} bill</span>` : null}
            ${sp.saleId ? html`<button className="btn ghost sm" onClick=${() => reprint(sp)}>Receipt</button>` : null}
            ${!sp.cleared ? html`<button className="btn ghost sm" disabled=${!canClear} title=${canClear ? 'Remove from the active register' : 'Available once served and paid'} onClick=${() => clear(sp)}>Clear</button>` : null}
          </div></td>
        </tr>`;
      })}</tbody></table></div>` : html`<div className="empty">${filter === 'active' ? 'No active special orders. New orders appear here.' : 'Nothing to show for this filter.'}</div>`}
    ${payFor ? html`<${CheckoutModal} title=${'Payment · special #' + payFor.no} total=${r2(payFor.price - (payFor.paidAmount || 0))} print="ask" onClose=${() => setPayFor(null)} onConfirm=${pay} />` : null}
  </div>`;
}

/* ---------------- TABLES ---------------- */
function TableModal({ no, onClose }) {
  const { s, update, notify, user, showReceipt } = useApp();
  const [payOpen, setPayOpen] = useState(false);
  const [spOpen, setSpOpen] = useState(false);
  const tab = s.tabs[no] || { lines: [] };
  const linked = tabLinked(s, no);
  const total = tabTotal(s, no);
  const add = (line) => { const r = update((d) => addToTab(d, no, line)); if (r.err) notify(r.err, 'err'); };
  const change = (key, delta) => { const r = update((d) => changeTabLine(d, no, key, delta)); if (r.err) notify(r.err, 'err'); };
  const closeEmpty = () => { update((d) => { delete d.tabs[no]; }); onClose(); };
  const settle = (pay) => {
    const sale = update((d) => settleTab(d, no, pay, user.name));
    setPayOpen(false); onClose();
    notify('Table ' + no + ' paid · ' + money(sale.total));
    showReceipt(sale, true);
  };
  const empty = !tab.lines.length && !linked.length;
  return html`<${Fragment}>
    <${Modal} title=${'Table ' + no} size="wide" onClose=${onClose}>
      <div className="split wide-r">
        <${ReadyMenu} reserved=${{ meat: {}, cons: {} }} onAdd=${add} />
        <div className="card stick">
          <div className="card-head"><h3>Bill · Table ${no}</h3></div>
          ${empty ? html`<div className="empty">Tap items on the left to start this table's bill</div>` : null}
          ${tab.lines.map((l) => html`<div className="cart-line" key=${l.key}>
            <div className="nm"><b>${l.name}</b><small>${l.label || ''}</small></div>
            ${l.kind === 'side' || l.kind === 'drink' ? html`<div className="stepper"><button onClick=${() => change(l.key, -1)} aria-label="Less">−</button><span>${l.qty}</span><button onClick=${() => change(l.key, 1)} aria-label="More">+</button></div>` : null}
            <div className="num-strong" style=${{ minWidth: '74px', textAlign: 'right' }}>${money(l.total)}</div>
            <button className="icon-btn" onClick=${() => change(l.key, -9999)} aria-label="Remove">✕</button>
          </div>`)}
          ${linked.map((sp) => html`<div className="cart-line" key=${sp.id}>
            <div className="nm"><b>Special #${sp.no} · ${sp.meat}</b><small>${qtyLabel(sp.qty, sp.unit)}${sp.style ? ' · ' + sp.style : ''} · ${sp.status}</small></div>
            <div className="num-strong" style=${{ minWidth: '74px', textAlign: 'right' }}>${money(sp.price)}</div>
            <span style=${{ width: '30px' }}></span>
          </div>`)}
          <div className="total-row"><span className="sec">Total</span><b>${money(total)}</b></div>
          <div className="col mt">
            <button className="btn soft" onClick=${() => setSpOpen(true)}>Add a special order</button>
            <button className="btn lg" disabled=${empty} onClick=${() => setPayOpen(true)}>Settle & pay</button>
            ${!linked.length && !tab.lines.length && s.tabs[no] ? html`<button className="btn ghost" onClick=${closeEmpty}>Close empty table</button>` : null}
          </div>
          <p className="hint" style=${{ margin: '10px 0 0' }}>Receipts print automatically when the table is paid.</p>
        </div>
      </div>
    <//>
    ${spOpen ? html`<${Modal} title=${'Special order · Table ' + no} size="mid" onClose=${() => setSpOpen(false)}><${SpecialForm} tableNo=${no} onDone=${() => setSpOpen(false)} /><//>` : null}
    ${payOpen ? html`<${CheckoutModal} title=${'Pay · Table ' + no} total=${total} print="auto" onClose=${() => setPayOpen(false)} onConfirm=${settle} />` : null}
  <//>`;
}

function TablesPage() {
  const { s } = useApp();
  const [open, setOpen] = useState(null);
  const n = s.settings.tables;
  const cards = [];
  for (let i = 1; i <= n; i++) {
    const tab = s.tabs[i];
    const linked = tabLinked(s, i);
    const isOpen = !!tab || linked.length > 0;
    const items = (tab ? sum(tab.lines, (l) => l.qty) : 0) + linked.length;
    cards.push(html`<button key=${i} className=${'tcard' + (isOpen ? ' open' : '')} onClick=${() => setOpen(i)}>
      <div className="row between"><span className="tn">${i}</span><span className=${'pill ' + (isOpen ? 'warn' : 'ok')}>${isOpen ? 'Open' : 'Free'}</span></div>
      <div className="muted">${isOpen ? (tab ? 'Opened ' + timeStr(tab.openedAt) : 'Special order') : 'Tap to open'}</div>
      ${isOpen ? html`<div className="amt">${money(tabTotal(s, i))}<span className="muted" style=${{ fontWeight: 400 }}> · ${r3(items)} items</span></div>` : null}
    </button>`);
  }
  return html`<div>
    <p className="hint">Tap a table to build its bill from ready-made meat, sides, drinks and special orders. The bill is paid when the table settles. Change the number of tables in Settings.</p>
    <div className="table-grid">${cards}</div>
    ${open ? html`<${TableModal} no=${open} onClose=${() => setOpen(null)} />` : null}
  </div>`;
}

/* =====================================================================
   UI — Part 3: Consumables · Sales · Expenses · Dashboard · Settings · App
   ===================================================================== */
const ymOf = (day) => day.slice(0, 7);
const monthRange = (ym) => { const p = ym.split('-').map(Number); return [ym + '-01', ym + '-' + pad(new Date(p[0], p[1], 0).getDate())]; };
const shiftMonth = (ym, d) => { const p = ym.split('-').map(Number); const t = new Date(p[0], p[1] - 1 + d, 1); return t.getFullYear() + '-' + pad(t.getMonth() + 1); };
const monthLabel = (ym) => { const p = ym.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); };
const monthShort = (ym) => { const p = ym.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-GB', { month: 'short' }); };

function MonthPicker({ value, onChange }) {
  const cur = ymOf(dayStr());
  return html`<div className="row">
    <button className="btn ghost sm" onClick=${() => onChange(shiftMonth(value, -1))} aria-label="Previous month">‹</button>

}

function ConsItemModal({ item, fixedCat, onClose }) {
  const { update, notify } = useApp();
  const [name, setName] = useState(item ? item.name : '');
  const [cat, setCat] = useState(item ? item.cat : fixedCat || 'supply');
  const [unit, setUnit] = useState(item ? item.unit : 'pc');
  const [price, setPrice] = useState(item ? String(item.price) : '');
  const [cost, setCost] = useState(item ? String(item.cost) : '');
  const [low, setLow] = useState(item ? String(item.low) : '3');
  const [qty, setQty] = useState('0');
  const go = () => {
    if (!name.trim()) { notify('Enter a name', 'err'); return; }
    update((d) => {
      if (item) {
        const c = consOf(d, item.id);
        c.name = name.trim(); c.cat = cat; c.unit = unit.trim() || 'pc'; c.price = num(price); c.cost = num(cost); c.low = num(low);
      } else {
        const id = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 14) + '-' + uid().slice(0, 3);
        d.cons.push({ id, name: name.trim(), cat, unit: unit.trim() || 'pc', price: cat === 'drink' ? num(price) : 0, cost: cat === 'drink' || cat === 'ingredient' ? num(cost) : 0, qty: num(qty), low: num(low), active: true });
        ensureDay(d, dayStr());
        d.consDays[dayStr()][id] = { opening: num(qty), received: 0, used: 0, closing: null, variance: 0 };
      }
    });
    notify(item ? 'Item updated' : 'Item added');
    onClose();
  };
  return html`<${Modal} title=${item ? 'Edit ' + item.name : fixedCat === 'drink' ? 'Add a drink' : fixedCat === 'ingredient' ? 'Add a kitchen ingredient' : 'Add a consumable'} onClose=${onClose} footer=${html`<button className="btn ghost" onClick=${onClose}>Cancel</button><button className="btn" onClick=${go}>${item ? 'Save changes' : 'Add item'}</button>`}>
    <div className="col">
      <${Field} label="Name"><input className="inp" value=${name} onChange=${(e) => setName(e.target.value)} autoFocus /><//>
      <div className="fgrid">
        ${fixedCat ? null : html`<${Field} label="Type"><select className="inp" value=${cat} onChange=${(e) => setCat(e.target.value)}><option value="supply">Consumable (serviettes, straws, takeaway…)</option><option value="ingredient">Kitchen ingredient (maize flour, oil…)</option><option value="drink">Drink (sold to customers)</option></select><//>`}
        <${Field} label="Unit"><input className="inp" value=${unit} onChange=${(e) => setUnit(e.target.value)} placeholder="bottle, bag, litre" /><//>
        <${Field} label="Low-stock alert at" sub="Alert when the amount left is at or below this"><input className="inp num" type="number" value=${low} onChange=${(e) => setLow(e.target.value)} /><//>
        ${item ? null : html`<${Field} label="Amount in stock now"><input className="inp num" type="number" value=${qty} onChange=${(e) => setQty(e.target.value)} /><//>`}
      </div>
      ${cat === 'drink' || cat === 'ingredient' ? html`<div className="fgrid">
        ${cat === 'drink' ? html`<${Field} label=${'Selling price (' + CUR + ')'}><input className="inp num" type="number" value=${price} onChange=${(e) => setPrice(e.target.value)} /><//>` : null}
        <${Field} label=${'Buying cost per ' + (unit || 'unit') + ' (' + CUR + ')'} sub="Used for profit figures"><input className="inp num" type="number" value=${cost} onChange=${(e) => setCost(e.target.value)} /><//>
      </div>` : null}
    </div>
  <//>`;
}

function ConsMoveModal({ type, item, onClose }) {

      </tr>`)}</tbody>
      <tfoot><tr><td colSpan="6">${active.length} sales${x_over(list)}</td><td className="r">${money(total)}</td><td colSpan="2"></td></tr></tfoot>
    </table></div>` : html`<div className="empty">No sales in ${monthLabel(ym)} for this filter.</div>`}
    ${voidFor ? html`<${VoidModal} sale=${voidFor} onClose=${() => setVoidFor(null)} />` : null}
  </div>`;
}
function x_over(list) { return list.length > 300 ? ' (showing the latest 300)' : ''; }

/* ---------------- EXPENSES ---------------- */
function ExpensesPage() {
  const { s, update, notify, user, ask } = useApp();
  const isAdmin = user.role === 'admin';
  const [ym, setYm] = useState(ymOf(dayStr()));
  const [date, setDate] = useState(dayStr());
  const [cat, setCat] = useState(EXPENSE_CATS[0]);
  const [title, setTitle] = useState('');
  const [amount, setAmount] = useState('');
  const [via, setVia] = useState('Cash');
  const r = monthRange(ym);
  const CASHIER_HIDDEN_CATS = ['Rent'];
  const list = s.expenses.filter((e) => inRange(e.day, r[0], r[1]) && (isAdmin || !CASHIER_HIDDEN_CATS.includes(e.cat))).sort((a, b) => b.day.localeCompare(a.day) || b.at.localeCompare(a.at));
  const catOptions = isAdmin ? EXPENSE_CATS : EXPENSE_CATS.filter((c) => !CASHIER_HIDDEN_CATS.includes(c));
  const total = sum(list, (e) => e.amount);
  const byCat = {};
  list.forEach((e) => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const add = () => {
    const a = num(amount);
    if (!(a > 0)) { notify('Enter the amount', 'err'); return; }
    update((d) => { d.expenses.push({ id: uid(), day: date, at: new Date().toISOString(), cat, title: title.trim(), amount: a, via, by: user.name }); });
    setTitle(''); setAmount('');
    notify('Expense recorded');
    if (ymOf(date) !== ym) setYm(ymOf(date));
  };
  const del = (e) => ask('Delete expense?', e.cat + ' · ' + money(e.amount) + (e.title ? ' · ' + e.title : ''), () => update((d) => { d.expenses = d.expenses.filter((x) => x.id !== e.id); }), true);
  return html`<div className="split">
    <div>
      <div className="row wrap between mb"><${MonthPicker} value=${ym} onChange=${setYm} /><b>${monthLabel(ym)} total: ${money(total)}</b></div>
      <p className="hint">Running costs such as charcoal, rent, salaries and electricity. Stock you buy for resale (meat, drinks) is not an expense; it becomes a cost only when sold, so record it through Receive stock.</p>
      ${list.length ? html`<div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>Date</th><th>Category</th><th>Details</th><th>Paid via</th><th className="r">Amount</th><th></th></tr></thead>
        <tbody>${list.map((e) => html`<tr key=${e.id}><td>${dateNice(e.day)}</td><td><span className="pill">${e.cat}</span></td><td>${e.title || html`<span className="muted">—</span>`}</td><td>${e.via}</td><td className="r num-strong">${money(e.amount)}</td><td className="right">${user.role === 'admin' ? html`<button className="icon-btn" onClick=${() => del(e)} aria-label="Delete expense">🗑</button>` : null}</td></tr>`)}</tbody>
      </table></div>` : html`<div className="empty">No expenses recorded for ${monthLabel(ym)}.</div>`}
      ${Object.keys(byCat).length ? html`<div className="card mt"><h3>By category</h3><div className="chips">${Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]).map((k) => html`<span className="chip" key=${k}>${k}<small>${money(byCat[k])}</small></span>`)}</div></div>` : null}
    </div>
    <div className="card stick">
      <h3>Record an expense</h3>
      <div className="col">
        <${Field} label="Date"><input className="inp" type="date" value=${date} max=${dayStr()} onChange=${(e) => setDate(e.target.value || dayStr())} /><//>
        <${Field} label="Category"><select className="inp" value=${cat} onChange=${(e) => setCat(e.target.value)}>${catOptions.map((c) => html`<option key=${c}>${c}</option>`)}</select><//>
        <${Field} label="Details (optional)"><input className="inp" value=${title} onChange=${(e) => setTitle(e.target.value)} placeholder="e.g. 2 bags charcoal" /><//>
        <${Field} label=${'Amount (' + CUR + ')'}><input className="inp num" type="number" inputMode="decimal" value=${amount} onChange=${(e) => setAmount(e.target.value)} /><//>
        <${Field} label="Paid via"><select className="inp" value=${via} onChange=${(e) => setVia(e.target.value)}><option>Cash</option><option>M-Pesa</option><option>Bank</option></select><//>
        <button className="btn lg" onClick=${add}>Save expense</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- DASHBOARD (monthly profit) ---------------- */
function DashboardPage() {
  const { s, go } = useApp();
  const cur = ymOf(dayStr());
  const [ym, setYm] = useState(cur);
  const isCur = ym === cur;
  const rng = monthRange(ym);
  const pl = useMemo(() => computePL(s, rng[0], rng[1]), [s, ym]);
  const months = useMemo(() => {
    const a = [];
    for (let i = 5; i >= 0; i--) { const m = shiftMonth(cur, -i); const r = monthRange(m); a.push({ ym: m, pl: computePL(s, r[0], r[1]) }); }
    return a;
  }, [s]);
  const today = computePL(s, dayStr(), dayStr());
  const maxV = Math.max(1, ...months.map((m) => Math.max(m.pl.rev, m.pl.gross, Math.abs(m.pl.net))));
  const h = (v) => Math.max(2, Math.round(Math.abs(v) / maxV * 100)) + '%';
  const receivable = sum(s.specials.filter((x) => !x.paid), (x) => x.price);
  const unpaidN = s.specials.filter((x) => !x.paid).length;
  const lowM = meatLow(s), lowC = consLow(s);
  const pend = s.requests.filter((r) => r.status === 'pending');
  const top = Object.keys(pl.items).sort((a, b) => pl.items[b] - pl.items[a]).slice(0, 6);
  const cats = Object.keys(pl.byCat).sort((a, b) => pl.byCat[b] - pl.byCat[a]);
  const payTotal = pl.pay.cash + pl.pay.mpesa + pl.pay.card;
  return html`<div className="col" style=${{ gap: '18px' }}>
    <div className="row wrap between">
      <${MonthPicker} value=${ym} onChange=${setYm} />
      <span className="pill info">${isCur ? 'Month to date · profit is worked out monthly' : 'Full month · profit is worked out monthly'}</span>
    </div>
    <div className="kpis">
      <div className="kpi"><div className="l">Sales revenue</div><div className="v">${money(pl.rev)}</div><div className="s">${pl.count} sales in ${monthLabel(ym)}</div></div>
      <div className="kpi hl"><div className="l">Gross profit (approx.)</div><div className=${'v ' + (pl.gross < 0 ? 'neg' : '')}>${money(pl.gross)}</div><div className="s">${pct(pl.gm)} of revenue</div></div>
      <div className="kpi"><div className="l">Operating expenses</div><div className="v">${money(pl.opex)}</div><div className="s">${cats.length} categories recorded</div></div>
      <div className="kpi hl"><div className="l">Net profit (approx.)</div><div className=${'v ' + (pl.net < 0 ? 'neg' : 'pos')}>${money(pl.net)}</div><div className="s">${pct(pl.nm)} net margin</div></div>
    </div>
    ${pl.opex === 0 && pl.rev > 0 ? html`<div className="alert"><span>💡</span><div>No expenses are recorded for ${monthLabel(ym)}, so net profit equals gross profit. Add rent, salaries, charcoal, electricity and other running costs in <button className="btn ghost sm" onClick=${() => go('expenses')}>Expenses</button> for a realistic figure.</div></div>` : null}
    <div className="split wide-r">
      <div className="col" style=${{ gap: '16px' }}>
        <div className="card">
          <div className="card-head"><h3>Profit and loss · ${monthLabel(ym)}</h3><span className="pill">Approximate</span></div>
          <div className="tbl-wrap" style=${{ border: 0 }}><table className="tbl">
            <thead><tr><th>Trading</th><th className="r">Revenue</th><th className="r">Cost of goods</th><th className="r">Gross profit</th><th className="r">Margin</th></tr></thead>
            <tbody>
              ${CHANNELS.map((c) => { const x = pl.ch[c.id]; const g = x.rev - x.cogs; return html`<tr key=${c.id}><td>${c.label}</td><td className="r">${money(x.rev)}</td><td className="r">${money(x.cogs)}</td><td className=${'r ' + (g < 0 ? 'neg' : '')}>${money(g)}</td><td className="r">${x.rev ? pct(g / x.rev) : '—'}</td></tr>`; })}
              <tr><td>Waste, spoilage and stock losses</td><td className="r">—</td><td className="r">${money(pl.shrink)}</td><td className=${'r ' + (pl.shrink ? 'neg' : '')}>${money(-pl.shrink)}</td><td className="r">—</td></tr>
              <tr className="total"><td>Gross profit</td><td className="r">${money(pl.rev)}</td><td className="r">${money(pl.cogs)}</td><td className=${'r ' + (pl.gross < 0 ? 'neg' : 'pos')}>${money(pl.gross)}</td><td className="r">${pct(pl.gm)}</td></tr>
            </tbody>
            <thead><tr><th colSpan="5" style=${{ paddingTop: '16px' }}>Operating expenses</th></tr></thead>
            <tbody>
              ${cats.length ? cats.map((k) => html`<tr key=${k} className="sub"><td colSpan="3">${k}</td><td className="r" colSpan="2">${money(pl.byCat[k])}</td></tr>`) : html`<tr className="sub"><td colSpan="5">No expenses recorded this month</td></tr>`}
              <tr className="total"><td colSpan="3">Total operating expenses</td><td className="r" colSpan="2">${money(pl.opex)}</td></tr>
              <tr className="total"><td colSpan="3">Net profit (before tax)</td><td className=${'r ' + (pl.net < 0 ? 'neg' : 'pos')} colSpan="2">${money(pl.net)} · ${pct(pl.nm)}</td></tr>
            </tbody>
          </table></div>
          <p className="hint" style=${{ margin: '12px 0 0' }}>How this is worked out: revenue is counted when payment is received (unpaid specials are shown separately). Cost of goods is the average buying cost of the meat, sides and drinks sold, plus recorded waste. Stock purchases are not expenses; they become a cost when sold. Selling prices are treated as tax-inclusive and no tax is deducted. This is a management estimate, not audited accounts.</p>
        </div>
        <div className="grid2">
          <div className="card"><h3>Best sellers</h3>${top.length ? html`<div className="col gap-sm">${top.map((k) => html`<div className="row between" key=${k}><span>${k}</span><b className="num-strong">${money(pl.items[k])}</b></div>`)}</div>` : html`<div className="empty">No sales this month</div>`}</div>

        </div>
      </div>
      <div className="col" style=${{ gap: '16px' }}>
        <div className="card">
          <div className="card-head"><h3>Last 6 months</h3></div>
          <div className="legend mb"><span><i></i>Revenue</span><span><i className="g"></i>Gross profit</span><span><i style=${{ background: 'var(--t-info)' }}></i>Net profit</span></div>
          <div className="bars">${months.map((m) => html`<div className="bar-col" key=${m.ym}>
            <div className="bar-pair">
              <div className="bar" style=${{ height: h(m.pl.rev) }} title=${'Revenue ' + money(m.pl.rev)}></div>
              <div className="bar g" style=${{ height: h(m.pl.gross) }} title=${'Gross profit ' + money(m.pl.gross)}></div>
              <div className="bar" style=${{ height: h(m.pl.net), background: m.pl.net < 0 ? 'var(--t-danger)' : 'var(--t-info)' }} title=${'Net profit ' + money(m.pl.net)}></div>
            </div>
            <small style=${{ fontWeight: m.ym === ym ? 700 : 400 }}>${monthShort(m.ym)}</small>
          </div>`)}</div>
        </div>
        <div className="card">
          <h3>Today at a glance</h3>
          <div className="row between"><span className="sec">Takings so far today</span><b className="num-strong">${money(today.rev)}</b></div>
          <div className="row between mt"><span className="sec">Sales today</span><b className="num-strong">${today.count}</b></div>
          <p className="hint" style=${{ margin: '10px 0 0' }}>Profit is only shown for whole months.</p>
        </div>
        <div className="card">
          <h3>Needs attention</h3>
          <div className="col gap-sm">
            ${unpaidN ? html`<div className="alert info"><span>🧾</span><div><b>${unpaidN} unpaid special${unpaidN > 1 ? 's' : ''}</b> · ${money(receivable)} still to collect. This is not in revenue until paid.</div></div>` : null}
            ${pend.length ? html`<div className="alert"><span>🍖</span><div>Kitchen is waiting on butchery: ${pend.map((r) => r.name).join(', ')}</div></div>` : null}
            ${lowM.length ? html`<div className="alert"><span>🥩</span><div><b>Low meat stock:</b> ${lowM.map((m) => m.name + ' (' + r3(m.stock) + ')').join(', ')}</div></div>` : null}
            ${lowC.length ? html`<div className="alert"><span>📦</span><div><b>Low consumables:</b> ${lowC.map((c) => c.name + ' (' + r3(c.qty) + ')').join(', ')}</div></div>` : null}
            ${!unpaidN && !pend.length && !lowM.length && !lowC.length ? html`<div className="empty">Nothing needs attention right now</div>` : null}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function DebtorsPage() {
  const { s, update, notify, user, showReceipt } = useApp();
  const [q, setQ] = useState('');
  const [payFor, setPayFor] = useState(null);
  let list = debtors(s);
  const total = sum(list, (x) => x.balance);
  const term = q.trim().toLowerCase();
  if (term) list = list.filter((x) => (x.name + ' ' + x.phone + ' ' + x.ref).toLowerCase().includes(term));
  const pay = (p, doPrint) => {
    const res = payFor.kind === 'special'
      ? update((d) => { const sale = paySpecial(d, payFor.id, p, user.name, null); return sale ? { sale } : { err: 'Could not record payment' }; })

    setPayFor(null);

  };
  return html`<div>
    <div className="row wrap between mb">
      <p className="hint" style=${{ margin: 0 }}>Everyone who currently owes money — customers sold to on credit in Butchery, and unpaid or deposit-only special orders and receipts, all in one place.</p>

function ReportsPage() {
  const { s } = useApp();
  const [period, setPeriod] = useState('month');
  const today = dayStr();
  const t = new Date();
  const back = (n) => { const d = new Date(t); d.setDate(d.getDate() - n); return dayStr(d); };
  const ranges = { today: [today, today], week: [back(6), today], month: monthRange(ymOf(today)) };
  const [from, to] = ranges[period];
  const pl = computePL(s, from, to);
  const waste = s.waste.filter((w) => inRange(w.day, from, to));
  const wasteByReason = {}; waste.forEach((w) => { wasteByReason[w.reason] = (wasteByReason[w.reason] || 0) + (w.cost || 0); });
  const supplierRows = s.suppliers.map((sup) => ({ sup, paid: sum(s.supplierPayments.filter((p) => p.supplierId === sup.id && inRange(p.day, from, to)), (p) => p.amount) }));
  const payrollByEmp = {}; s.payroll.filter((p) => inRange(p.day, from, to)).forEach((p) => { payrollByEmp[p.name] = (payrollByEmp[p.name] || 0) + p.amount; });
  const outstandingSpecials = s.specials.filter((x) => !x.paid && !x.cleared);
  const outstandingSales = s.sales.filter((x) => !x.voided && x.status !== 'paid');
  const outstandingTotal = sum(outstandingSpecials, (x) => x.price - (x.paidAmount || 0)) + sum(outstandingSales, (x) => x.balance);
  return html`<div className="col" style=${{ gap: '16px' }}>
    <${Tabs} value=${period} onChange=${setPeriod} tabs=${[{ id: 'today', label: 'Today' }, { id: 'week', label: 'Last 7 days' }, { id: 'month', label: 'This month' }]} />
    <div className="kpis">
      <div className="kpi"><div className="l">Revenue</div><div className="v">${money(pl.rev)}</div><div className="s">${pl.count} sales</div></div>
      <div className="kpi hl"><div className="l">Gross profit</div><div className="v">${money(pl.gross)}</div><div className="s">${pct(pl.gm)}</div></div>
      <div className="kpi"><div className="l">Expenses & staff cost</div><div className="v">${money(pl.opex)}</div></div>
      <div className="kpi hl"><div className="l">Net profit</div><div className=${'v ' + (pl.net < 0 ? 'neg' : 'pos')}>${money(pl.net)}</div><div className="s">${pct(pl.nm)}</div></div>
    </div>
    <div className="grid2">
      <div className="card"><h3>Sales by section</h3><div className="col gap-sm">${CHANNELS.map((c) => html`<div className="row between" key=${c.id}><span>${c.label}</span><b className="num-strong">${money(pl.ch[c.id].rev)}</b></div>`)}</div></div>
      <div className="card"><h3>Stock loss / waste</h3>${Object.keys(wasteByReason).length ? html`<div className="col gap-sm">${Object.keys(wasteByReason).map((k) => html`<div className="row between" key=${k}><span>${k}</span><b className="num-strong neg">${money(wasteByReason[k])}</b></div>`)}<div className="row between total" style=${{ paddingTop: '6px', borderTop: '1px solid var(--t-border)' }}><span>Total</span><b>${money(pl.shrink)}</b></div></div>` : html`<div className="empty">No waste recorded</div>`}</div>
      <div className="card"><h3>Suppliers</h3>${supplierRows.length ? html`<div className="col gap-sm">${supplierRows.map((r) => html`<div className="row between" key=${r.sup.id}><span>${r.sup.name}</span><span>paid ${money(r.paid)} · owes ${money(r.sup.balance)}</span></div>`)}</div>` : html`<div className="empty">No suppliers on file</div>`}</div>
      <div className="card"><h3>Employee payments</h3>${Object.keys(payrollByEmp).length ? html`<div className="col gap-sm">${Object.keys(payrollByEmp).map((k) => html`<div className="row between" key=${k}><span>${k}</span><b className="num-strong">${money(payrollByEmp[k])}</b></div>`)}</div>` : html`<div className="empty">No payments in this period</div>`}</div>
    </div>
    <div className="card">
      <div className="card-head"><h3>Outstanding customer balances</h3><b>${money(outstandingTotal)}</b></div>
      ${outstandingSpecials.length || outstandingSales.length ? html`<div className="col gap-sm">
        ${outstandingSpecials.map((x) => html`<div className="row between" key=${x.id}><span>Special #${x.no} · ${x.customer || 'walk-in'}${x.phone ? ' · ' + x.phone : ''}</span><b className="num-strong">${money(x.price - (x.paidAmount || 0))}</b></div>`)}
        ${outstandingSales.map((x) => html`<div className="row between" key=${x.id}><span>${receiptNo(x)} · ${SRC_LABEL[x.source] || x.source}</span><b className="num-strong">${money(x.balance)}</b></div>`)}
      </div>` : html`<div className="empty">Nothing outstanding right now</div>`}
    </div>
  </div>`;
}

function Login({ users, name, onLogin }) {
  const [u, setU] = useState('');
  const [p, setP] = useState('');
  const [err, setErr] = useState('');
  const submit = () => {
    const f = users.find((x) => x.username.toLowerCase() === u.trim().toLowerCase() && x.pass === p);
    if (!f) { setErr('Wrong username or password.'); return; }
    onLogin(f);
  };
  const key = (e) => { if (e.key === 'Enter') submit(); };
  return html`<div className="login-wrap"><div className="login-card">
    <div className="logo">🐖</div>
    <div><h2>${name}</h2><p>Sign in to run the shop.</p></div>
    <${Field} label="Username"><input className="inp" value=${u} onChange=${(e) => { setU(e.target.value); setErr(''); }} onKeyDown=${key} autoFocus autoCapitalize="none" /><//>
    <${Field} label="Password"><input className="inp" type="password" value=${p} onChange=${(e) => { setP(e.target.value); setErr(''); }} onKeyDown=${key} /><//>
    ${err ? html`<div className="err-msg">${err}</div>` : null}
    <button className="btn lg block" onClick=${submit}>Sign in</button>
  </div></div>`;
}

                ${row('Paid for stock', t.cash.purchasesOut, true)}
                ${row('Expenses', t.cash.expensesOut, true)}
                ${row('To suppliers', t.cash.supplierOut, true)}
                ${row('Salaries & advances', t.cash.payrollOut, true)}
                ${row('Banked today', t.cash.depositsOut, true)}
                <tr className="total"><td>Expected cash</td><td className="r">${money(t.cash.expected)}</td></tr>
              </tbody>
            </table></div>
            ${counted !== '' ? html`<div className="row between mt"><span className="sec">Difference</span><b className=${num(counted) - t.cash.expected < 0 ? 'neg' : num(counted) - t.cash.expected > 0 ? 'pos' : ''}>${money(num(counted) - t.cash.expected)}</b></div>` : null}
          </div>
          <div>
            <div className="sec-title">M-Pesa</div>
            <div className="fgrid">
              <${Field} label="Opening balance"><input className="inp num" type="number" value=${openMpesa} onChange=${(e) => setOpenMpesa(e.target.value)} /><//>
              <${Field} label="Balance per M-Pesa statement" sub="Optional — leave blank to skip checking this"><input className="inp num" type="number" value=${countedMpesa} onChange=${(e) => setCountedMpesa(e.target.value)} /><//>
            </div>
            <div className="tbl-wrap mt" style=${{ border: 0 }}><table className="tbl">
              <tbody>
                ${row('M-Pesa sales collected', t.mpesa.salesIn)}
                ${row('Paid for stock', t.mpesa.purchasesOut, true)}
                ${row('Expenses', t.mpesa.expensesOut, true)}
                ${row('To suppliers', t.mpesa.supplierOut, true)}
                ${row('Salaries & advances', t.mpesa.payrollOut, true)}
                ${row('Withdrawn to bank today', t.mpesa.depositsOut, true)}
                <tr className="total"><td>Expected M-Pesa balance</td><td className="r">${money(t.mpesa.expected)}</td></tr>
              </tbody>
            </table></div>
            ${countedMpesa !== '' ? html`<div className="row between mt"><span className="sec">Difference</span><b className=${num(countedMpesa) - t.mpesa.expected < 0 ? 'neg' : num(countedMpesa) - t.mpesa.expected > 0 ? 'pos' : ''}>${money(num(countedMpesa) - t.mpesa.expected)}</b></div>` : null}
          </div>
        </div>
        <button className="btn lg block mt" onClick=${save}>Save till count</button>
        ${existing ? html`<p className="hint" style=${{ margin: '8px 0 0' }}>Already counted today at ${timeStr(existing.at)}: cash variance ${money(existing.variance)}${existing.varianceMpesa !== null ? ', M-Pesa variance ' + money(existing.varianceMpesa) : ''}.</p>` : null}
      </div>
      <div className="card"><div className="card-head"><h3>Recent till counts</h3></div>
        ${history.length ? html`<div className="tbl-wrap" style=${{ border: 0 }}><table className="tbl"><thead><tr><th>Date</th><th className="r">Cash expected</th><th className="r">Cash counted</th><th className="r">Cash variance</th><th className="r">M-Pesa variance</th></tr></thead>
          <tbody>${history.map((x) => html`<tr key=${x.id}><td>${dateNice(x.day)}</td><td className="r">${money(x.expected)}</td><td className="r">${money(x.counted)}</td><td className=${'r ' + (x.variance < 0 ? 'neg' : x.variance > 0 ? 'pos' : '')}>${money(x.variance)}</td><td className="r">${x.varianceMpesa === null || x.varianceMpesa === undefined ? html`<span className="muted">—</span>` : html`<span className=${x.varianceMpesa < 0 ? 'neg' : x.varianceMpesa > 0 ? 'pos' : ''}>${money(x.varianceMpesa)}</span>`}</td></tr>`)}</tbody></table></div>` : html`<div className="empty">No till counts recorded yet</div>`}
      </div>
    </div>
    <div className="card stick">
      <h3>Bank movements</h3>
      <p className="hint">Cash taken to the bank, or M-Pesa withdrawn out — either way this is reflected in the till count above for that day.</p>
      <div className="col">
        <${Field} label="Type"><div className="chips"><button className=${'chip' + (depMethod === 'cash' ? ' on' : '')} onClick=${() => setDepMethod('cash')}>Cash deposit</button><button className=${'chip' + (depMethod === 'mpesa' ? ' on' : '')} onClick=${() => setDepMethod('mpesa')}>M-Pesa withdrawal</button></div><//>
        <${Field} label=${'Amount (' + CUR + ')'}><input className="inp num" type="number" value=${depAmt} onChange=${(e) => setDepAmt(e.target.value)} /><//>
        <${Field} label="Reference / slip number (optional)"><input className="inp" value=${depRef} onChange=${(e) => setDepRef(e.target.value)} /><//>
        <button className="btn" onClick=${deposit}>Record</button>
      </div>
      ${deposits.length ? html`<div className="mt"><div className="sec-title">Recorded on ${dateNice(day)}</div><div className="col gap-sm">${deposits.map((x) => html`<div className="row between" key=${x.id}><span>${timeStr(x.at)} · ${(x.method || 'cash') === 'mpesa' ? 'M-Pesa' : 'Cash'} · ${x.by}${x.ref ? ' · ' + x.ref : ''}</span><b>${money(x.amount)}</b></div>`)}</div></div>` : null}
    </div>
  </div>`;
}

function AppLoader() {
  const [state, setState] = useState({ status: 'loading', data: null, err: null });
  useEffect(() => {
    let alive = true;
    apiLoadState().then((data) => { if (alive) setState({ status: 'ready', data, err: null }); })
      .catch((e) => { if (alive) setState({ status: 'error', data: null, err: e }); });
    return () => { alive = false; };
  }, []);
  if (state.status === 'loading') return html`<div className="login-wrap"><div className="login-card center"><div className="logo">🐖</div><p>Connecting to the local server…</p></div></div>`;
  if (state.status === 'error') return html`<div className="login-wrap"><div className="login-card">
    <div className="logo">⚠️</div>
    <h2>Can't reach the local server</h2>
    <p>Make sure the SmartPOS server is running (open a terminal in the project folder and run <code>node server.js</code>), then reload this page.</p>
    <button className="btn lg block" onClick=${() => window.location.reload()}>Try again</button>
  </div></div>`;
  return html`<${App} initial=${state.data} />`;
}
function GlobalSearch({ isAdmin }) {
  const { s, go } = useApp();
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const term = q.trim().toLowerCase();
  const results = [];
  if (term.length >= 2) {
    s.sales.filter((x) => !x.voided).forEach((x) => { if ((receiptNo(x) + ' ' + x.cashier + ' ' + x.lines.map((l) => l.name).join(' ')).toLowerCase().includes(term)) results.push({ icon: '🧾', label: receiptNo(x) + ' · ' + money(x.total), sub: SRC_LABEL[x.source] || x.source, page: 'sales' }); });
    s.specials.forEach((x) => { if ((x.customer + ' ' + x.phone + ' ' + x.meat + ' #' + x.no).toLowerCase().includes(term)) results.push({ icon: '🍖', label: 'Special #' + x.no + (x.customer ? ' · ' + x.customer : ''), sub: x.meat + (x.phone ? ' · ' + x.phone : ''), page: 'kitchen' }); });
    if (isAdmin) s.suppliers.forEach((x) => { if (x.name.toLowerCase().includes(term)) results.push({ icon: '🚚', label: x.name, sub: 'Owed ' + money(x.balance), page: 'suppliers' }); });
    s.meats.forEach((m) => { if (m.name.toLowerCase().includes(term)) results.push({ icon: m.emoji, label: m.name, sub: 'Butchery ' + r3(m.stock) + (m.kind === 'bird' ? ' birds' : ' kg'), page: 'butchery' }); });
    [].concat(s.sides, s.cons.filter((c) => c.cat === 'drink')).forEach((x) => { if (x.name.toLowerCase().includes(term)) results.push({ icon: '🍽️', label: x.name, sub: money(x.price), page: 'kitchen' }); });
  }
  return html`<div style=${{ position: 'relative' }}>
    <input className="inp" style=${{ width: '220px' }} placeholder="Search sales, specials, suppliers…" value=${q}
      onChange=${(e) => { setQ(e.target.value); setOpen(true); }} onFocus=${() => setOpen(true)} onBlur=${() => setTimeout(() => setOpen(false), 150)} />
    ${open && term.length >= 2 ? html`<div className="card" style=${{ position: 'absolute', top: '110%', right: 0, width: '300px', maxHeight: '340px', overflow: 'auto', zIndex: 50, padding: '8px' }}>
      ${results.length ? results.slice(0, 12).map((r, i) => html`<button key=${i} className="nav-item" style=${{ color: 'var(--t-text)' }} onClick=${() => { go(r.page); setQ(''); setOpen(false); }}><span className="ic">${r.icon}</span><span style=${{ textAlign: 'left' }}><b style=${{ display: 'block' }}>${r.label}</b><small className="muted">${r.sub}</small></span></button>`) : html`<div className="empty" style=${{ padding: '10px' }}>No matches</div>`}
    </div>` : null}
  </div>`;
}

function App({ initial }) {
  const [s, setS] = useState(initial);
  const ref = useRef(s);
  const [user, setUser] = useState(() => { try { const u = sessionStorage.getItem('mh_user'); return u ? JSON.parse(u) : null; } catch (e) { return null; } });
  const [page, setPage] = useState(null);
  const [receipt, setReceipt] = useState(null);
  const [confirmBox, setConfirmBox] = useState(null);
  const [toast, setToast] = useState(null);
  const [navOpen, setNavOpen] = useState(false);
  CUR = s.settings.currency || 'KSh';

  const update = useCallback((fn) => { const next = clone(ref.current); const res = fn(next); ref.current = next; setS(next); saveState(next); return res; }, []);
  const replaceAll = useCallback((next) => { ref.current = next; setS(next); saveState(next); flushSave(); }, []);
  const notify = useCallback((msg, kind) => { setToast({ msg, kind: kind || 'ok', id: Date.now() }); if (ref.current.settings.sounds !== false) (kind === 'err' ? SOUND.err : SOUND.ok)(); }, []);
  const showReceipt = useCallback((sale, auto) => setReceipt({ sale, auto: !!auto, id: Date.now() }), []);
  const ask = useCallback((title, msg, onYes, danger) => setConfirmBox({ title, msg, onYes, danger }), []);
  const requestMore = useCallback((meatId, qty) => {
    const u = user;
    const res = update((d) => {
      if (d.requests.some((r) => r.meatId === meatId && r.status === 'pending')) return 'dup';
      const m = meatOf(d, meatId);
      d.requests.push({ id: uid(), day: dayStr(), at: new Date().toISOString(), meatId, name: m.name, qty: qty > 0 ? qty : 10, by: u ? u.name : 'Kitchen', status: 'pending' });
      return 'ok';
    });
    notify(res === 'dup' ? 'A request for that meat is already waiting' : 'Request sent to the butchery', res === 'dup' ? 'err' : 'ok');
  }, [user]);

  useEffect(() => { if (!toast) return undefined; const t = setTimeout(() => setToast(null), 3400); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { document.documentElement.setAttribute('data-skin', s.settings.theme || 'dark'); }, [s.settings.theme]);
  useEffect(() => {
    const roll = () => { if (!ref.current.consDays[dayStr()]) update((d) => { ensureDay(d, dayStr()); }); };
    roll();
    const t = setInterval(roll, 60000);
    const onHide = () => flushSave();
    window.addEventListener('pagehide', onHide);
    document.addEventListener('visibilitychange', onHide);
    return () => { clearInterval(t); window.removeEventListener('pagehide', onHide); document.removeEventListener('visibilitychange', onHide); };
  }, []);

  const login = (u) => { try { sessionStorage.setItem('mh_user', JSON.stringify(u)); } catch (e) { /* ignore */ } setUser(u); setPage(null); };
  const logout = () => { try { sessionStorage.removeItem('mh_user'); } catch (e) { /* ignore */ } setUser(null); setPage(null); };
  const ctx = { s, update, replaceAll, notify, user, showReceipt, ask, requestMore, go: (p) => { setPage(p); setNavOpen(false); } };

  if (!user) return html`<${Login} users=${s.users} name=${s.settings.business} onLogin=${login} />`;
  const live = s.users.find((x) => x.id === user.id) || user;
  if (live.role === 'admin' && !s.settings.setupDone) return html`<${Ctx.Provider} value=${ctx}><${SetupWizard} onDone=${() => setPage(null)} /><//>`;
  const isAdmin = live.role === 'admin';
  const cur = page && PAGES[page] && (isAdmin || !(NAV.some((g) => g.items.some((i) => i.id === page && i.admin)))) ? page : (isAdmin ? 'dashboard' : 'tables');
  const Page = PAGES[cur];
  const badges = { inventory: consLow(s).length + meatLow(s).length + readyLowMeats(s).length, kitchen: s.specials.filter((x) => !x.cleared && x.status !== 'served').length, debtors: debtors(s).length };
  const themes = ['dark', 'light', 'warm', 'auto'];
  const nextTheme = () => update((d) => { d.settings.theme = themes[(themes.indexOf(d.settings.theme) + 1) % themes.length]; });
  const ctx2 = Object.assign({}, ctx, { user: live });

  return html`<${Ctx.Provider} value=${ctx2}>
    <div className=${'app' + (navOpen ? ' nav-open' : '')}>
      <aside className="sidebar">
        <div className="brand"><div className="logo">🐖</div><div><b>${s.settings.business}</b><small>SmartPOS v2</small></div></div>
        <nav className="nav">${NAV.map((g) => {
          const items = g.items.filter((i) => !i.admin || isAdmin);
          if (!items.length) return null;
          return html`<div key=${g.sec}><div className="nav-sec">${g.sec}</div>${items.map((i) => html`<button key=${i.id} className=${'nav-item' + (cur === i.id ? ' active' : '')} onClick=${() => { setPage(i.id); setNavOpen(false); }}><span className="ic">${i.icon}</span>${i.label}${badges[i.id] ? html`<span className="bdg">${badges[i.id]}</span>` : null}</button>`)}</div>`;
        })}</nav>
        <div className="side-foot"><b>${live.name}</b>${isAdmin ? 'Administrator' : 'Cashier'}<div className="mt"><button className="btn ghost sm" onClick=${logout}>Sign out</button></div></div>
      </aside>
      <div className="scrim" onClick=${() => setNavOpen(false)}></div>
      <div className="main">
        <header className="topbar">
          <button className="icon-btn menu-btn" onClick=${() => setNavOpen(true)} aria-label="Open menu">☰</button>
          <h1>${TITLES[cur]}</h1>
          <span className="grow"></span>
          <${GlobalSearch} isAdmin=${isAdmin} />
          <span className="date">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span>
          <button className="btn ghost sm" onClick=${nextTheme} title="Change colour theme">◐ Theme</button>
        </header>
        <main className="content"><${Page} key=${cur} /></main>
      </div>
    </div>
    ${receipt ? html`<${ReceiptModal} key=${receipt.id} sale=${receipt.sale} auto=${receipt.auto} onClose=${() => setReceipt(null)} />` : null}
    ${confirmBox ? html`<${Modal} title=${confirmBox.title} onClose=${() => setConfirmBox(null)} footer=${html`<button className="btn ghost" onClick=${() => setConfirmBox(null)}>Cancel</button><button className=${'btn' + (confirmBox.danger ? ' warn' : '')} onClick=${() => { const f = confirmBox.onYes; setConfirmBox(null); f(); }}>Confirm</button>`}><p>${confirmBox.msg}</p><//>` : null}
    ${toast ? html`<div className=${'toast' + (toast.kind === 'err' ? ' err' : '')} role="status" key=${toast.id}>${toast.msg}</div>` : null}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppLoader));

</script>
</body>
</html>
