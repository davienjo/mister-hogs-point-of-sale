<!doctype html>
<html lang="en" data-skin="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mister Hogs · SmartPOS v2</title>
<style>
:root{
--t-bg:#0f0f14;--t-bgCard:#1a1a22;--t-bgHover:#22222c;--t-bgElevated:#252532;--t-bgInput:#1e1e28;--t-border:#2a2a38;--t-borderLight:#3a3a4a;--t-text:#f0f0f5;--t-textSecondary:#a0a0b8;--t-textMuted:#6b6b82;--t-primary:#e63946;--t-primaryHover:#c12a37;--t-primaryFg:#fff;--t-accent:#ff6b35;--t-success:#2ecc71;--t-danger:#e74c3c;--t-warning:#f39c12;--t-info:#3498db;--t-gold:#f1c40f;--t-surface:#13131a;--t-sidebar:linear-gradient(180deg,#12121a 0%,#0a0a10 100%);--t-sbText:#f0f0f5;--t-sbMuted:#8a8aa3;--t-shadow:0 4px 24px #0000004d;--t-shadowLg:0 12px 40px #00000073;--t-overlay:#000000a6;
--radius:12px;--radius-sm:8px;--radius-lg:16px;--transition:all .18s ease;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-skin="light"]{--t-bg:#f3f4f8;--t-bgCard:#ffffff;--t-bgHover:#eef0f6;--t-bgElevated:#ffffff;--t-bgInput:#f1f3f8;--t-border:#e3e6ee;--t-borderLight:#d0d5e2;--t-text:#1b1c26;--t-textSecondary:#565a70;--t-textMuted:#8a8ea4;--t-primary:#e63946;--t-primaryHover:#c12a37;--t-primaryFg:#fff;--t-accent:#ff6b35;--t-success:#16a34a;--t-danger:#dc2626;--t-warning:#d97706;--t-info:#2563eb;--t-gold:#ca8a04;--t-surface:#ffffff;--t-sidebar:linear-gradient(180deg,#ffffff 0%,#f0f2f8 100%);--t-sbText:#1b1c26;--t-sbMuted:#7a7e94;--t-shadow:0 4px 20px #1b1c2614;--t-shadowLg:0 12px 40px #1b1c2626;--t-overlay:#1b1c2680;}
:root[data-skin="warm"]{--t-bg:#f6efe5;--t-bgCard:#fffaf2;--t-bgHover:#f1e5d5;--t-bgElevated:#fffdf9;--t-bgInput:#f3e8d9;--t-border:#e6d7c2;--t-borderLight:#d6c3a8;--t-text:#3a2a1e;--t-textSecondary:#725c48;--t-textMuted:#a08a74;--t-primary:#d6402f;--t-primaryHover:#b93223;--t-primaryFg:#fff;--t-accent:#e08a2b;--t-success:#2f8f4e;--t-danger:#c0392b;--t-warning:#c77d0a;--t-info:#2f6f9f;--t-gold:#b8860b;--t-surface:#fffaf2;--t-sidebar:linear-gradient(180deg,#3b2a1e 0%,#2a1c12 100%);--t-sbText:#f7ecdd;--t-sbMuted:#c2a88c;--t-shadow:0 4px 20px #3a2a1e1f;--t-shadowLg:0 12px 40px #3a2a1e33;--t-overlay:#2a1c1299;}
:root[data-skin="auto"]{--t-bg:#f3f4f8;--t-bgCard:#ffffff;--t-bgHover:#eef0f6;--t-bgElevated:#ffffff;--t-bgInput:#f1f3f8;--t-border:#e3e6ee;--t-borderLight:#d0d5e2;--t-text:#1b1c26;--t-textSecondary:#565a70;--t-textMuted:#8a8ea4;--t-primary:#e63946;--t-primaryHover:#c12a37;--t-primaryFg:#fff;--t-accent:#ff6b35;--t-success:#16a34a;--t-danger:#dc2626;--t-warning:#d97706;--t-info:#2563eb;--t-gold:#ca8a04;--t-surface:#ffffff;--t-sidebar:linear-gradient(180deg,#ffffff 0%,#f0f2f8 100%);--t-sbText:#1b1c26;--t-sbMuted:#7a7e94;--t-shadow:0 4px 20px #1b1c2614;--t-shadowLg:0 12px 40px #1b1c2626;--t-overlay:#1b1c2680;}
@media (prefers-color-scheme:dark){:root[data-skin="auto"]:not([data-theme="light"]){--t-bg:#0f0f14;--t-bgCard:#1a1a22;--t-bgHover:#22222c;--t-bgElevated:#252532;--t-bgInput:#1e1e28;--t-border:#2a2a38;--t-borderLight:#3a3a4a;--t-text:#f0f0f5;--t-textSecondary:#a0a0b8;--t-textMuted:#6b6b82;--t-primary:#e63946;--t-primaryHover:#c12a37;--t-primaryFg:#fff;--t-accent:#ff6b35;--t-success:#2ecc71;--t-danger:#e74c3c;--t-warning:#f39c12;--t-info:#3498db;--t-gold:#f1c40f;--t-surface:#13131a;--t-sidebar:linear-gradient(180deg,#12121a 0%,#0a0a10 100%);--t-sbText:#f0f0f5;--t-sbMuted:#8a8aa3;--t-shadow:0 4px 24px #0000004d;--t-shadowLg:0 12px 40px #00000073;--t-overlay:#000000a6;}}
:root[data-skin="auto"][data-theme="dark"]{--t-bg:#0f0f14;--t-bgCard:#1a1a22;--t-bgHover:#22222c;--t-bgElevated:#252532;--t-bgInput:#1e1e28;--t-border:#2a2a38;--t-borderLight:#3a3a4a;--t-text:#f0f0f5;--t-textSecondary:#a0a0b8;--t-textMuted:#6b6b82;--t-primary:#e63946;--t-primaryHover:#c12a37;--t-primaryFg:#fff;--t-accent:#ff6b35;--t-success:#2ecc71;--t-danger:#e74c3c;--t-warning:#f39c12;--t-info:#3498db;--t-gold:#f1c40f;--t-surface:#13131a;--t-sidebar:linear-gradient(180deg,#12121a 0%,#0a0a10 100%);--t-sbText:#f0f0f5;--t-sbMuted:#8a8aa3;--t-shadow:0 4px 24px #0000004d;--t-shadowLg:0 12px 40px #00000073;--t-overlay:#000000a6;}

*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow:hidden}
body{height:100%;background:var(--t-bg);color:var(--t-text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100%}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3,h4{line-height:1.25;font-weight:700}
:focus-visible{outline:2px solid var(--t-accent);outline-offset:2px}
.dim{opacity:.5}
.muted{color:var(--t-textMuted)}
.sec{color:var(--t-textSecondary)}
.right{text-align:right}
.center{text-align:center}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.gap-sm{gap:6px}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.hint{color:var(--t-textMuted);font-size:12.5px;margin-bottom:12px;max-width:70ch}
.num-strong{font-variant-numeric:tabular-nums;font-weight:700}
td,.num,.kpi .v{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;height:100%}
.sidebar{width:236px;flex-shrink:0;background:var(--t-sidebar);color:var(--t-sbText);display:flex;flex-direction:column;border-right:1px solid var(--t-border);z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--t-primary),var(--t-accent));display:grid;place-items:center;font-size:20px}
.brand b{display:block;font-size:15px;letter-spacing:.1px}
.brand small{color:var(--t-sbMuted);font-size:11.5px}
.nav{flex:1;overflow:auto;padding:4px 10px 12px}
.nav-sec{color:var(--t-sbMuted);font-size:11.5px;font-weight:600;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:transparent;color:var(--t-sbText);text-align:left;transition:var(--transition);opacity:.82}
.nav-item:hover{background:#ffffff14;opacity:1}
.nav-item.active{background:linear-gradient(90deg,var(--t-primary),color-mix(in srgb,var(--t-primary) 70%,var(--t-accent)));color:#fff;opacity:1;box-shadow:0 4px 14px color-mix(in srgb,var(--t-primary) 35%,transparent)}
.nav-item .ic{width:22px;text-align:center;font-size:16px}
.nav-item .bdg{margin-left:auto;background:var(--t-warning);color:#1b1206;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.nav-item.active .bdg{background:#fff;color:var(--t-primary)}
.side-foot{padding:12px 14px;border-top:1px solid var(--t-border);font-size:12.5px;color:var(--t-sbMuted)}
.side-foot b{color:var(--t-sbText);display:block;font-size:13.5px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--t-border);background:var(--t-surface)}
.topbar h1{font-size:19px}
.topbar .date{color:var(--t-textMuted);font-size:12.5px}
.menu-btn{display:none}
.content{flex:1;overflow:auto;padding:20px 22px 40px}
.scrim{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;background:var(--t-primary);color:var(--t-primaryFg);font-weight:600;transition:var(--transition);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--t-primaryHover)}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--t-text);border-color:var(--t-borderLight)}
.btn.ghost:hover:not(:disabled){background:var(--t-bgHover)}
.btn.soft{background:var(--t-bgElevated);color:var(--t-text);border-color:var(--t-border)}
.btn.soft:hover:not(:disabled){background:var(--t-bgHover)}
.btn.good{background:var(--t-success);color:#06210f}
.btn.good:hover:not(:disabled){filter:brightness(1.08);background:var(--t-success)}
.btn.warn{background:var(--t-warning);color:#1b1206}
.btn.danger-ghost{background:transparent;color:var(--t-danger);border-color:color-mix(in srgb,var(--t-danger) 45%,transparent)}
.btn.danger-ghost:hover:not(:disabled){background:color-mix(in srgb,var(--t-danger) 12%,transparent)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lg{padding:13px 20px;font-size:15px}
.btn.block{width:100%}
.icon-btn{border:0;background:transparent;color:var(--t-textMuted);font-size:16px;padding:6px 9px;border-radius:8px}
.icon-btn:hover{background:var(--t-bgHover);color:var(--t-text)}
.inp,select.inp,textarea.inp{background:var(--t-bgInput);color:var(--t-text);border:1px solid var(--t-border);border-radius:var(--radius-sm);padding:9px 11px;width:100%;font-family:inherit;font-size:14px;transition:var(--transition)}
.inp:focus{border-color:var(--t-accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--t-accent) 22%,transparent)}
textarea.inp{resize:vertical;min-height:70px}
.inp.num{text-align:right;min-width:80px}
.tbl .inp{padding:6px 8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;color:var(--t-textSecondary);font-weight:600}
.field .sub{font-size:11.5px;color:var(--t-textMuted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--t-bgElevated);color:var(--t-textSecondary);border:1px solid var(--t-border)}
.pill.ok{background:color-mix(in srgb,var(--t-success) 16%,transparent);color:var(--t-success);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--t-warning) 18%,transparent);color:var(--t-warning);border-color:transparent}
.pill.danger{background:color-mix(in srgb,var(--t-danger) 16%,transparent);color:var(--t-danger);border-color:transparent}
.pill.info{background:color-mix(in srgb,var(--t-info) 16%,transparent);color:var(--t-info);border-color:transparent}
.tabs{display:flex;gap:4px;padding:4px;background:var(--t-bgCard);border:1px solid var(--t-border);border-radius:12px;width:fit-content;max-width:100%;overflow:auto;margin-bottom:16px}
.tab{border:0;background:transparent;color:var(--t-textSecondary);padding:8px 15px;border-radius:9px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--t-text)}
.tab.active{background:var(--t-primary);color:#fff}
.tab .bdg{margin-left:7px;background:var(--t-warning);color:#1b1206;border-radius:999px;font-size:11px;padding:0 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--t-borderLight);background:var(--t-bgCard);color:var(--t-text);padding:7px 13px;border-radius:999px;font-weight:500;transition:var(--transition)}
.chip:hover:not(:disabled){background:var(--t-bgHover)}
.chip.on{background:var(--t-primary);border-color:var(--t-primary);color:#fff}
.chip:disabled{opacity:.4}
.chip small{color:var(--t-textMuted);margin-left:5px}
.chip.on small{color:#ffffffc0}

/* ---------- cards & layout ---------- */
.card{background:var(--t-bgCard);border:1px solid var(--t-border);border-radius:var(--radius);padding:16px}
.card.flat{box-shadow:none}
.card h3{font-size:15px;margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{margin:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.split.wide-r{grid-template-columns:minmax(0,1fr) 420px}
.stick{position:sticky;top:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sec-title{font-size:13px;font-weight:700;color:var(--t-textSecondary);margin:4px 0 10px}
.empty{color:var(--t-textMuted);text-align:center;padding:26px 12px;border:1px dashed var(--t-borderLight);border-radius:var(--radius);font-size:13.5px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--t-warning) 40%,transparent);background:color-mix(in srgb,var(--t-warning) 11%,transparent);font-size:13px}
.alert.danger{border-color:color-mix(in srgb,var(--t-danger) 45%,transparent);background:color-mix(in srgb,var(--t-danger) 11%,transparent)}
.alert.info{border-color:color-mix(in srgb,var(--t-info) 40%,transparent);background:color-mix(in srgb,var(--t-info) 10%,transparent)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--t-border);border-radius:var(--radius);background:var(--t-bgCard)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--t-textMuted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--t-border);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--t-border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--t-bgHover)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tfoot td{font-weight:700;background:var(--t-bgElevated)}
.tbl tr.total td{font-weight:700;background:var(--t-bgElevated);border-top:1px solid var(--t-borderLight)}
.tbl tr.sub td{color:var(--t-textSecondary);font-size:12.5px}
.pos{color:var(--t-success)}.neg{color:var(--t-danger)}

/* ---------- selling UI ---------- */
.meat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.meat-card{background:var(--t-bgCard);border:1px solid var(--t-border);border-radius:var(--radius);padding:13px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:var(--transition)}
button.meat-card:hover{border-color:var(--t-borderLight);background:var(--t-bgHover)}
.meat-card.sel{border-color:var(--t-primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--t-primary) 30%,transparent)}
.meat-card.out{opacity:.75}
.mc-top{display:flex;align-items:center;gap:10px}
.mc-emoji{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--t-bgElevated);display:grid;place-items:center;flex-shrink:0}
.mc-name{font-weight:700}
.mc-sub{color:var(--t-textMuted);font-size:12.5px}
.mc-top .pill{margin-left:auto}
.portion-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.portion{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:9px;border:1px solid var(--t-borderLight);background:var(--t-bgElevated);color:var(--t-text);transition:var(--transition)}
.portion b{font-size:13px}
.portion span{font-size:11.5px;color:var(--t-textMuted)}
.portion:hover:not(:disabled){border-color:var(--t-primary);background:color-mix(in srgb,var(--t-primary) 12%,var(--t-bgElevated))}
.portion:disabled{opacity:.35}
.portion.two{grid-column:span 2}
.qty-panel{border:1px solid var(--t-primary);border-radius:var(--radius);padding:16px;background:color-mix(in srgb,var(--t-primary) 6%,var(--t-bgCard));margin-top:14px}
.qty-panel h4{margin-bottom:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--t-textMuted);font-size:12px;margin:12px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--t-border)}
.cart-line{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--t-border)}
.cart-line:last-child{border-bottom:0}
.cart-line .nm{flex:1;min-width:0}
.cart-line .nm b{display:block;font-weight:600}
.cart-line .nm small{color:var(--t-textMuted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--t-borderLight);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--t-bgElevated);width:28px;height:28px;font-size:15px}
.stepper button:hover{background:var(--t-bgHover)}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.total-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-size:15px}
.total-row b{font-size:24px}
.stock-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stock-chip{display:flex;align-items:center;gap:9px;background:var(--t-bgCard);border:1px solid var(--t-border);border-radius:12px;padding:8px 12px}
.stock-chip b{font-size:15px}
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{border-radius:var(--radius);border:1px solid var(--t-border);background:var(--t-bgCard);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:112px;transition:var(--transition)}
.tcard:hover{border-color:var(--t-borderLight);transform:translateY(-1px)}
.tcard .tn{font-size:24px;font-weight:800}
.tcard.open{border-color:var(--t-accent);background:color-mix(in srgb,var(--t-accent) 9%,var(--t-bgCard))}
.tcard .amt{margin-top:auto;font-weight:700}

/* ---------- KPIs & charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--t-bgCard);border:1px solid var(--t-border);border-radius:var(--radius);padding:15px 16px}
.kpi .l{color:var(--t-textSecondary);font-size:12.5px;font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin:4px 0 2px}
.kpi .s{color:var(--t-textMuted);font-size:12px}
.kpi.hl{border-color:color-mix(in srgb,var(--t-accent) 55%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--t-primary) 12%,var(--t-bgCard)),var(--t-bgCard))}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar-pair{display:flex;align-items:flex-end;gap:3px;flex:1;width:100%;justify-content:center}
.bar{width:38%;max-width:22px;border-radius:5px 5px 0 0;min-height:2px;background:var(--t-primary)}
.bar.g{background:var(--t-success)}
.bar-col small{color:var(--t-textMuted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t-textSecondary)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--t-primary)}
.legend i.g{background:var(--t-success)}

/* ---------- modal / toast / receipt ---------- */
.modal-overlay{position:fixed;inset:0;background:var(--t-overlay);display:grid;place-items:center;padding:16px;z-index:100;backdrop-filter:blur(2px)}
.modal{background:var(--t-bgCard);border:1px solid var(--t-borderLight);border-radius:var(--radius-lg);box-shadow:var(--t-shadowLg);width:min(480px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column}
.modal.wide{width:min(1100px,100%)}
.modal.mid{width:min(680px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--t-border)}
.modal-body{padding:18px;overflow:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--t-border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t-bgElevated);border:1px solid var(--t-borderLight);border-left:4px solid var(--t-success);padding:11px 18px;border-radius:10px;box-shadow:var(--t-shadowLg);z-index:200;max-width:92vw;font-weight:500}
.toast.err{border-left-color:var(--t-danger)}
.receipt-sheet{background:#fff;color:#111;font-family:"Courier New",ui-monospace,monospace;font-size:12.5px;line-height:1.45;width:300px;max-width:100%;margin:0 auto;padding:16px 14px;border-radius:6px}
.receipt-sheet h4{text-align:center;font-size:16px;margin-bottom:2px}
.receipt-sheet .c{text-align:center}
.receipt-sheet hr{border:0;border-top:1px dashed #555;margin:8px 0}
.receipt-sheet .ln{display:flex;justify-content:space-between;gap:8px}
.receipt-sheet .ln span:first-child{flex:1}
.receipt-sheet .big{font-weight:700;font-size:14px}

/* ---------- login ---------- */
.login-wrap{height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% 10%,color-mix(in srgb,var(--t-primary) 20%,transparent),transparent),radial-gradient(800px 500px at 90% 95%,color-mix(in srgb,var(--t-accent) 16%,transparent),transparent),var(--t-bg)}
.login-card{width:min(410px,100%);background:var(--t-bgCard);border:1px solid var(--t-border);border-radius:var(--radius-lg);box-shadow:var(--t-shadowLg);padding:30px 28px;display:flex;flex-direction:column;gap:16px}
.login-card .logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--t-primary),var(--t-accent));display:grid;place-items:center;font-size:28px}
.login-card h2{font-size:24px}
.login-card p{color:var(--t-textSecondary)}
.err-msg{color:var(--t-danger);font-size:13px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.split,.split.wide-r{grid-template-columns:1fr}.stick{position:static}}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--t-overlay);z-index:30}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 14px}
  .content{padding:14px 12px 40px}
  .grid2,.grid3{grid-template-columns:1fr}
  .topbar .date{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  body *{visibility:hidden}
  .receipt-sheet,.receipt-sheet *{visibility:visible}
  .receipt-sheet{position:fixed;left:0;top:0;width:100%;max-width:none;padding:6px}
}
.sec-title.mt{margin-top:22px}
.bars{height:180px}
.bar-pair{flex:none;height:140px;align-items:flex-end}
.bar-col{justify-content:flex-end}
.tbl thead+tbody+thead th{border-top:1px solid var(--t-border)}

<script>
/* Minimal, self-contained tagged-template → h(type, props, ...children) compiler,
   covering exactly the syntax this app's templates use:
     <tag attr="x" attr={expr} bool ...>children</tag>
     <tag ... />                       (self-closing)
     <${Expr} ...>...<//>              (component via interpolated type, htm-style short close)
     ${expr} in text / attribute position
   No JSX build step and no external library — everything runs in the browser as-is. */
(function () {
  function parse(strings) {
    var buf = [];
    for (var i = 0; i < strings.length; i++) { buf.push(strings[i]); if (i < strings.length - 1) buf.push({ hole: i }); }
    var toks = [];
    buf.forEach(function (b) { if (typeof b === 'string') { if (b) toks.push({ t: 's', v: b }); } else toks.push({ t: 'h', i: b.hole }); });
    var ti = 0, ci = 0;
    function cur() { return ti < toks.length ? toks[ti] : null; }
    function atHole() { var c = cur(); return !!(c && c.t === 'h'); }
    function peekChar() { var c = cur(); if (!c || c.t === 'h') return null; return c.v[ci]; }
    function advanceChar() { var c = cur(); var ch = c.v[ci]; ci++; if (ci >= c.v.length) { ti++; ci = 0; } return ch; }
    function takeHole() { var c = cur(); ti++; return c.i; }
    function skipWs() { var ch; while ((ch = peekChar()) !== null && /\s/.test(ch)) advanceChar(); }
    function atEnd() { return !cur(); }
    function startsWith(s) { var c = cur(); if (!c || c.t !== 's') return false; return c.v.slice(ci, ci + s.length) === s; }
    function consumeLiteral(s) { for (var k = 0; k < s.length; k++) advanceChar(); }

    function readNodes(stopAtClose) {
      var kids = []; var text = '';
      function flush() { if (text !== '') { kids.push({ text: text }); text = ''; } }
      while (true) {
        if (atEnd()) { flush(); return kids; }
        if (stopAtClose && (startsWith('<//>') || startsWith('</'))) { flush(); return kids; }
        if (peekChar() === '<') { flush(); kids.push(readElement()); continue; }
        if (atHole()) { flush(); kids.push({ expr: takeHole() }); continue; }
        text += advanceChar();
      }
    }
    function readChildren() { return readNodes(true); }
    function readTagName() {
      if (atHole()) return { expr: takeHole() };
      var name = '';
      while (true) { var ch = peekChar(); if (ch === null || /[\s/>]/.test(ch)) break; name += advanceChar(); }
      return { lit: name };
    }
    function readAttrs() {
      var attrs = [];
      while (true) {
        skipWs();
        if (peekChar() === '/' || peekChar() === '>' || atEnd()) return attrs;
        var name = '';
        while (true) { var ch = peekChar(); if (ch === null || /[\s=/>]/.test(ch)) break; name += advanceChar(); }
        if (!name) { if (atHole()) { takeHole(); continue; } return attrs; }
        skipWs();
        if (peekChar() === '=') {
          advanceChar(); skipWs();
          var val; var q = peekChar();
          if (q === '"' || q === "'") { advanceChar(); var s2 = ''; while (peekChar() !== q) s2 += advanceChar(); advanceChar(); val = { lit: s2 }; }
          else if (atHole()) { val = { expr: takeHole() }; }
          else { val = { lit: '' }; }
          attrs.push({ name: name, value: val });
        } else { attrs.push({ name: name, value: { lit: true } }); }
      }
    }
    function readElement() {
      advanceChar();
      var tagName = readTagName();
      var attrs = readAttrs();
      skipWs();
      if (peekChar() === '/') { advanceChar(); if (peekChar() === '>') advanceChar(); return { tag: tagName, attrs: attrs, children: [] }; }
      if (peekChar() === '>') advanceChar();
      var children = readChildren();
      if (startsWith('<//>')) consumeLiteral('<//>');
      else if (startsWith('</')) { consumeLiteral('</'); while (peekChar() !== '>' && peekChar() !== null) advanceChar(); if (peekChar() === '>') advanceChar(); }
      return { tag: tagName, attrs: attrs, children: children };
    }
    skipWs();
    return readNodes(false);
  }

  function buildOne(h, node, values) {
    if (node.text !== undefined) return node.text;
    if (node.expr !== undefined) return values[node.expr];
    var type = node.tag.lit !== undefined ? node.tag.lit : values[node.tag.expr];
    var props = null;
    node.attrs.forEach(function (a) {
      var v = a.value.expr !== undefined ? values[a.value.expr] : a.value.lit;
      props = props || {};
      props[a.name] = v;
    });
    var kids = node.children.map(function (c) { return buildOne(h, c, values); }).filter(function (v) { return v !== '' && v !== null && v !== undefined; });
    return h.apply(null, [type, props].concat(kids));
  }

  function tag(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    var nodes = parse(strings).filter(function (n) { return n.text === undefined || n.text.trim() !== ''; });
    var built = nodes.map(function (n) { return buildOne(this, n, values); }, this);
    return built.length > 1 ? built : built[0];
  }

  window.htm = { bind: function (h) { return tag.bind(h); } };
})();

<script>
'use strict';
/* =====================================================================
   MISTER HOGS · SMARTPOS v2  — business logic (no DOM, no React)
   ===================================================================== */
const STORE_KEY = 'mh_smartpos_v2';
const pad = (n, l = 2) => String(n).padStart(l, '0');
const dayStr = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const timeStr = (iso) => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dateNice = (day) => {
  const p = day.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
};
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const r3 = (n) => Math.round((n + Number.EPSILON) * 1000) / 1000;
const clone = (o) => JSON.parse(JSON.stringify(o));
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
let CUR = 'KSh';
const money = (n) => {
  n = Math.round(n || 0);
  return (n < 0 ? '-' : '') + CUR + ' ' + Math.abs(n).toLocaleString('en-US');
};
const pct = (x) => (isFinite(x) ? (x * 100).toFixed(1) : '0.0') + '%';

const FRACS = [0.25, 0.5, 0.75, 1];
const FRAC_LABEL = { 0.25: '¼ kg', 0.5: '½ kg', 0.75: '¾ kg', 1: '1 kg' };
const qtyLabel = (qty, unit) => {
  if (unit === 'bird') return qty === 1 ? 'Full bird' : qty === 0.5 ? 'Half bird' : qty + ' birds';
  return FRAC_LABEL[qty] || (r3(qty) + ' kg');
};
const CHANNELS = [
  { id: 'butchery', label: 'Butchery (raw meat)' },
  { id: 'ready', label: 'Kitchen · Ready-made' },
  { id: 'special', label: 'Kitchen · Specials (incl. sides)' },
  { id: 'side', label: 'Sides' },
  { id: 'drink', label: 'Drinks' },
];
const EXPENSE_CATS = ['Charcoal', 'Gas & fuel', 'Electricity', 'Water', 'Cleaning', 'Transport', 'Maintenance', 'Rent', 'Licences & fees', 'Other'];
const WASTE_REASONS = ['Spoilage', 'Trimming loss', 'Damaged meat', 'Preparation waste', 'Other'];
const PAY_TYPES = { daily: 'Paid daily', weekly: 'Paid weekly', monthly: 'Paid monthly' };
const OUT_METHODS = ['Cash', 'M-Pesa', 'Bank'];

/* ---------------- seed data (sample values — all editable in Settings) ---------------- */
function seed() {
  return {
    v: 2,
    settings: { business: 'Mister Hogs', address: '', phone: '', footer: 'Karibu tena! Thank you for your business.', currency: 'KSh', tables: 10, theme: 'dark', sounds: true, printerWidth: '80', setupDone: false, portionGrams: 250 },
    users: [
      { id: 'u1', username: 'admin', name: 'Administrator', role: 'admin', pass: 'admin' },
      { id: 'u2', username: 'cashier', name: 'Cashier', role: 'cashier', pass: '1234' },
    ],
    meats: [
      { id: 'beef', name: 'Beef', emoji: '🐄', kind: 'kg', butchery: 800, butcheryPortions: { 0.25: 200, 0.5: 400, 0.75: 600, 1: 800 }, ready: 1100, readyPortions: { 0.25: 280, 0.5: 550, 0.75: 830, 1: 1100 }, readyLow: 8, special: 1200, specialPortions: { 0.25: 310, 0.5: 610, 0.75: 910, 1: 1200 }, cost: 620, stock: 40, low: 8, active: true },
      { id: 'goat', name: 'Goat', emoji: '🐐', kind: 'kg', butchery: 1000, butcheryPortions: { 0.25: 250, 0.5: 500, 0.75: 750, 1: 1000 }, ready: 1300, readyPortions: { 0.25: 330, 0.5: 650, 0.75: 980, 1: 1300 }, readyLow: 8, special: 1400, specialPortions: { 0.25: 360, 0.5: 710, 0.75: 1060, 1: 1400 }, cost: 780, stock: 30, low: 6, active: true },
      { id: 'pork', name: 'Pork', emoji: '🐖', kind: 'kg', butchery: 750, butcheryPortions: { 0.25: 190, 0.5: 375, 0.75: 560, 1: 750 }, ready: 1000, readyPortions: { 0.25: 250, 0.5: 500, 0.75: 750, 1: 1000 }, readyLow: 8, special: 1100, specialPortions: { 0.25: 290, 0.5: 570, 0.75: 850, 1: 1100 }, cost: 560, stock: 25, low: 6, active: true },
      { id: 'chicken', name: 'Chicken', emoji: '🐔', kind: 'bird', butchery: 850, butcheryPortions: { full: 850, half: 450 }, ready: 0, readyPortions: {}, special: 1300, specialPortions: { full: 1300, half: 700 }, cost: 600, stock: 20, low: 5, active: true },
    ],
    sides: [
      { id: 'ugali', name: 'Ugali', price: 50, cost: 0, active: true },
      { id: 'chapati', name: 'Chapati', price: 30, cost: 10, active: true },
      { id: 'rice', name: 'Rice', price: 100, cost: 35, active: true },
      { id: 'sukuma', name: 'Sukuma / Spinach', price: 50, cost: 15, active: true },
      { id: 'cabbage', name: 'Cabbage', price: 50, cost: 15, active: true },
      { id: 'potatoes', name: 'Potatoes', price: 100, cost: 35, active: true },
      { id: 'soup', name: 'Soup', price: 80, cost: 25, active: true },
      { id: 'kachumbari', name: 'Kachumbari', price: 40, cost: 12, active: true },
    ],
    styles: ['Choma', 'Chemsha', 'Tumbukiza', 'Fry', 'Stew'],
    instructions: ['No salt', 'Less spice', 'Extra spicy', 'Well done', 'Extra soup', 'No onions', 'Boneless', 'Extra chili', 'Serve hot'],
    cons: [
      { id: 'soda', name: 'Soda 300ml', cat: 'drink', unit: 'bottle', price: 60, cost: 42, qty: 48, low: 12, active: true },
      { id: 'water', name: 'Water 500ml', cat: 'drink', unit: 'bottle', price: 50, cost: 30, qty: 48, low: 12, active: true },
      { id: 'juice', name: 'Juice', cat: 'drink', unit: 'pack', price: 100, cost: 65, qty: 24, low: 6, active: true },
      { id: 'beer', name: 'Beer', cat: 'drink', unit: 'bottle', price: 250, cost: 190, qty: 24, low: 6, active: true },
      { id: 'maize', name: 'Maize flour (unga)', cat: 'ingredient', unit: 'kg', price: 0, cost: 130, qty: 50, low: 10, active: true },
      { id: 'oil', name: 'Cooking oil', cat: 'ingredient', unit: 'litre', price: 0, cost: 320, qty: 20, low: 5, active: true },
      { id: 'napkins', name: 'Serviettes', cat: 'supply', unit: 'pack', price: 0, cost: 0, qty: 10, low: 3, active: true },
      { id: 'straws', name: 'Drinking straws', cat: 'supply', unit: 'pack', price: 0, cost: 0, qty: 10, low: 3, active: true },
      { id: 'takeaway', name: 'Takeaway containers', cat: 'supply', unit: 'pack', price: 0, cost: 0, qty: 10, low: 3, active: true },
      { id: 'paper', name: 'Receipt paper', cat: 'supply', unit: 'roll', price: 0, cost: 0, qty: 6, low: 2, active: true },
    ],
    kitchen: { beef: 0, goat: 0, pork: 0 },
    requests: [], sales: [], specials: [], expenses: [], waste: [], transfers: [], purchases: [], usage: [],
    tabs: {}, counters: {}, consDays: {}, readyDays: {},
    employees: [], payroll: [],
    suppliers: [], supplierPayments: [],
    reconciliations: [], deposits: [],
    audit: [],
  };
}

/* ---------------- lookups ---------------- */
const meatOf = (s, id) => s.meats.find((m) => m.id === id);
const consOf = (s, id) => s.cons.find((c) => c.id === id);
const activeMeats = (s) => s.meats.filter((m) => m.active !== false);
const readyMeats = (s) => s.meats.filter((m) => m.active !== false && m.kind === 'kg' && m.readyPortions && m.readyPortions[1] > 0);
const receiptNo = (sale) => sale.day.slice(2).replace(/-/g, '') + '-' + pad(sale.no, 3);

function nextNo(s, key, day) {
  s.counters[key] = s.counters[key] || {};
  s.counters[key][day] = (s.counters[key][day] || 0) + 1;
  return s.counters[key][day];
}

/* ---------------- consumables: daily opening / closing ---------------- */
function ensureDay(s, day) {
  s.consDays[day] = s.consDays[day] || {};
  s.cons.forEach((c) => {
    if (!s.consDays[day][c.id]) s.consDays[day][c.id] = { opening: c.qty, received: 0, used: 0, closing: null, variance: 0 };
  });
}
function consDay(s, day, id) {
  ensureDay(s, day);
  return s.consDays[day][id];
}

/* ---------------- stock movement ---------------- */
function stockAvail(s, loc, id) {
  if (loc === 'butchery') { const m = meatOf(s, id); return m ? m.stock : 0; }
  if (loc === 'kitchen') return s.kitchen[id] || 0;
  if (loc === 'cons') { const c = consOf(s, id); return c ? c.qty : 0; }
  return Infinity;
}
function stockName(s, loc, id) {
  if (loc === 'cons') { const c = consOf(s, id); return c ? c.name : id; }
  const m = meatOf(s, id);
  const n = m ? m.name : id;
  return loc === 'kitchen' ? n + ' (kitchen)' : n;
}
function checkStock(s, list) {
  // Kitchen ready-made stock is a running balance, not a hard limit: a cashier can sell
  // before the morning transfer is logged. It's allowed to go negative and is reconciled
  // automatically the moment butchery sends meat through — no double deduction either way.
  const need = {};
  list.forEach((d) => { if (d.loc === 'kitchen') return; const k = d.loc + '|' + d.id; need[k] = r3((need[k] || 0) + d.qty); });
  const keys = Object.keys(need);
  for (let i = 0; i < keys.length; i++) {
    const p = keys[i].split('|');
    const have = stockAvail(s, p[0], p[1]);
    if (need[keys[i]] > have + 1e-9) return 'Not enough ' + stockName(s, p[0], p[1]) + ' — only ' + r3(have) + ' left';
  }
  return null;
}
function logAudit(s, type, detail, by) {
  s.audit.push({ id: uid(), at: new Date().toISOString(), day: dayStr(), type, detail, by });
}
function applyDeducts(s, list, dir, day) {
  list.forEach((d) => {
    const q = d.qty * dir;
    if (d.loc === 'butchery') { const m = meatOf(s, d.id); if (m) m.stock = r3(m.stock - q); }
    else if (d.loc === 'kitchen') {
      s.kitchen[d.id] = (s.kitchen[d.id] || 0) - q;
      const rd = readyDayOf(s, day, d.id);
      if (rd) rd.used = Math.max(0, rd.used + q);
    }
    else if (d.loc === 'cons') {
      const c = consOf(s, d.id);
      if (c) {
        ensureDay(s, day);
        c.qty = r3(c.qty - q);
        const cd = consDay(s, day, c.id);
        cd.used = Math.max(0, r3(cd.used + q));
      }
    }
  });
}

/* ---------------- line helpers (cart / tab / sale lines) ---------------- */
/* ---------------- ready-made portions ---------------- */
// Ready-made stock is kept in whole portions, not raw kg — a portion is a
// configurable weight (default 250g). Converting kg to portions happens once,
// at the moment meat is transferred from the butchery into the kitchen.
const portionsFromKg = (grams, kg) => Math.round((kg * 1000) / grams);
const kgFromPortions = (grams, portions) => r3((portions * grams) / 1000);
const portionsLabel = (grams, portions) => portions + (portions === 1 ? ' portion' : ' portions') + ' (' + kgFromPortions(grams, portions) + ' kg)';
function ensureReadyDay(s, day) {
  s.readyDays[day] = s.readyDays[day] || {};
  readyMeats(s).forEach((m) => {
    if (!s.readyDays[day][m.id]) s.readyDays[day][m.id] = { opening: s.kitchen[m.id] || 0, received: 0, used: 0, closing: null, variance: 0 };
  });
}
function readyDayOf(s, day, id) { ensureReadyDay(s, day); return s.readyDays[day][id]; }
const readyLowMeats = (s) => readyMeats(s).filter((m) => (s.kitchen[m.id] || 0) <= (m.readyLow || 0));

const readyMeatLine = (m, kg, grams) => {
  const portions = portionsFromKg(grams, kg);
  return {
    key: 'rm-' + uid(), kind: 'meat', ch: 'ready', mid: m.id, name: m.name, label: qtyLabel(kg, 'kg'),
    qty: kg, unit: 'kg', total: (m.readyPortions && m.readyPortions[kg]) || 0, cost: r2(m.cost * kg), deduct: [{ loc: 'kitchen', id: m.id, qty: portions }],
  };
};
const sideLine = (x) => ({ key: 'side-' + x.id, kind: 'side', ch: 'side', name: x.name, label: '', qty: 1, unit: 'pc', total: x.price, cost: x.cost || 0, deduct: [] });
const drinkLine = (c) => ({ key: 'drk-' + c.id, kind: 'drink', ch: 'drink', name: c.name, label: '', qty: 1, unit: c.unit || 'pc', total: c.price, cost: c.cost || 0, deduct: [{ loc: 'cons', id: c.id, qty: 1 }] });
const specialLine = (sp) => ({
  key: 'sp-' + sp.id, kind: 'special', ch: 'special', name: 'Special #' + sp.no + ' · ' + sp.meat,
  label: qtyLabel(sp.qty, sp.unit) + (sp.style ? ' · ' + sp.style : ''), qty: sp.qty, unit: sp.unit, total: sp.price, cost: sp.cost, deduct: [],
});
function scaleLine(line, newQty) {
  const ratio = newQty / line.qty;
  return Object.assign({}, line, {
    qty: newQty,
    total: Math.round(line.total * ratio),
    cost: r2(line.cost * ratio),
    deduct: (line.deduct || []).map((d) => Object.assign({}, d, { qty: r3(d.qty * ratio) })),
  });
}
function addLineTo(lines, line) {
  const i = line.kind === 'meat' ? -1 : lines.findIndex((l) => l.key === line.key);
  if (i < 0) return lines.concat([line]);
  const merged = scaleLine(lines[i], lines[i].qty + line.qty);
  return lines.map((l, j) => (j === i ? merged : l));
}
function reservedOf(lines) {
  const meat = {}, cons = {};
  lines.forEach((l) => (l.deduct || []).forEach((d) => {
    const t = d.loc === 'kitchen' ? meat : d.loc === 'cons' ? cons : null;
    if (t) t[d.id] = r3((t[d.id] || 0) + d.qty);
  }));
  return { meat, cons };
}

/* ---------------- sales ---------------- */
// Money actually received against a sale, with the day each part arrived. A credit
// sale paid next week is therefore counted (till, profit) on the day the money came in.
function payAmount(p) { return p ? (p.cash || 0) + (p.mpesa || 0) + (p.card || 0) : 0; }
function salePayments(x) {
  if (x.payments) return x.payments;
  const paid = r2(x.total - (x.balance || 0));
  if (!x.pay || paid <= 0) return [];
  return [{ at: x.at, day: x.day, cash: x.pay.cash || 0, mpesa: x.pay.mpesa || 0, card: x.pay.card || 0, amount: paid, ref: x.pay.ref || '' }];
}
const mkPayment = (pay, by) => ({ at: new Date().toISOString(), day: dayStr(), cash: pay.cash || 0, mpesa: pay.mpesa || 0, card: pay.card || 0, amount: r2(payAmount(pay)), ref: pay.ref || '', by: by || '' });
function createSale(s, o) {
  const day = dayStr();
  const lines = o.lines;
  if (o.deduct !== false) applyDeducts(s, lines.flatMap((l) => l.deduct || []), 1, day);
  const no = nextNo(s, 'sale', day);
  const total = r2(sum(lines, (l) => l.total));
  const paidNow = o.pay ? r2(payAmount(o.pay)) : 0;
  const cust = o.customer && (o.customer.name || o.customer.phone) ? { name: (o.customer.name || '').trim(), phone: (o.customer.phone || '').trim() } : null;
  const sale = {
    id: uid(), no, day, at: new Date().toISOString(), source: o.source,
    lines: lines.map((l) => ({ name: l.name, label: l.label, qty: l.qty, unit: l.unit, kind: l.kind, ch: l.ch, total: l.total, cost: l.cost || 0, deduct: l.deduct || [] })),
    total, cogs: r2(sum(lines, (l) => l.cost || 0)),
    pay: o.pay || null, payments: o.pay && paidNow > 0 ? [mkPayment(o.pay, o.cashier)] : [],
    status: o.pay ? (paidNow >= total - 0.5 ? 'paid' : 'partial') : 'unpaid', balance: r2(Math.max(0, total - paidNow)),
    cashier: o.cashier, tableNo: o.tableNo || null, deducted: o.deduct !== false, voided: false,
    special: o.special || null, customer: cust,
  };
  s.sales.push(sale);
  return sale;
}
// Receive money against a sale that still has a balance (credit sale, unpaid ready-made,
// part-paid). The payment is dated today, whatever day the sale itself was made.
function settleSaleBalance(s, saleId, pay, by) {
  const sale = s.sales.find((x) => x.id === saleId);
  if (!sale || sale.voided || sale.status === 'paid') return { err: 'Nothing owing on this sale' };
  const got = r2(payAmount(pay));
  if (!(got > 0)) return { err: 'Enter an amount above zero' };
  if (got > sale.balance + 0.5) return { err: 'That is more than the balance of ' + money(sale.balance) };
  sale.payments = salePayments(sale).slice();
  sale.payments.push(mkPayment(pay, by));
  sale.pay = sale.pay ? { method: 'split', cash: (sale.pay.cash || 0) + (pay.cash || 0), mpesa: (sale.pay.mpesa || 0) + (pay.mpesa || 0), card: (sale.pay.card || 0) + (pay.card || 0), ref: pay.ref || sale.pay.ref } : Object.assign({}, pay);
  sale.balance = r2(Math.max(0, sale.balance - got));
  sale.status = sale.balance <= 0.5 ? 'paid' : 'partial';
  if (sale.status === 'paid') sale.balance = 0;
  sale.settledBy = by;
  if (sale.special) { const sp = s.specials.find((x) => x.id === sale.special); if (sp) { sp.paidAmount = r2((sp.paidAmount || 0) + got); sp.paid = sp.paidAmount >= sp.price - 0.5; } }
  logAudit(s, 'Debt payment', receiptNo(sale) + (sale.customer && sale.customer.name ? ' · ' + sale.customer.name : '') + ' · ' + money(got), by);
  return { sale };
}
// Everyone who currently owes the business money, from every source, in one list —
// so the Debtors screen and the outstanding figure in Reports can never disagree.
function debtors(s) {
  const list = [];
  s.sales.filter((x) => !x.voided && x.status !== 'paid' && x.balance > 0.5 && !x.special && !x.tableNo).forEach((x) => {
    list.push({ kind: 'sale', id: x.id, name: (x.customer && x.customer.name) || 'Walk-in customer', phone: (x.customer && x.customer.phone) || '', ref: receiptNo(x), source: x.source === 'butchery' ? 'Butchery credit' : x.source === 'ready' ? 'Kitchen · ready-made' : 'Sale', at: x.at, day: x.day, total: x.total, paid: r2(x.total - x.balance), balance: x.balance });
  });
  s.specials.filter((x) => !x.paid && !x.cleared && !x.tableNo && x.price - (x.paidAmount || 0) > 0.5).forEach((x) => {
    list.push({ kind: 'special', id: x.id, name: x.customer || 'Walk-in customer', phone: x.phone || '', ref: 'Special #' + x.no, source: 'Special order', at: x.at, day: x.day, total: x.price, paid: x.paidAmount || 0, balance: r2(x.price - (x.paidAmount || 0)) });
  });
  return list.sort((a, b) => a.at.localeCompare(b.at));
}
function voidSale(s, saleId, reason, by) {
  const sale = s.sales.find((x) => x.id === saleId);
  if (!sale) return 'Sale not found';
  if (sale.voided) return 'Already voided';
  if (!reason || !reason.trim()) return 'Give a reason for the void';
  if (sale.deducted) applyDeducts(s, sale.lines.flatMap((l) => l.deduct || []), -1, sale.day);
  sale.voided = true; sale.voidReason = reason.trim(); sale.voidBy = by; sale.voidAt = new Date().toISOString();
  if (sale.tableNo) { s.specials.filter((x) => x.saleId === sale.id).forEach((sp) => { sp.paid = false; sp.paidAmount = 0; sp.saleId = null; }); }
  if (sale.special) { const sp = s.specials.find((x) => x.id === sale.special); if (sp) { sp.paidAmount = Math.max(0, r2((sp.paidAmount || 0) - (sale.total - sale.balance))); sp.paid = sp.paidAmount >= sp.price - 0.5; if (!sp.paid) sp.saleId = null; } }
  logAudit(s, 'Void sale', 'Receipt ' + receiptNo(sale) + ' · ' + money(sale.total) + ' · ' + reason.trim(), by);
  return null;
}

/* ---------------- butchery ↔ kitchen ---------------- */
function transferToKitchen(s, meatId, qty, by, type) {
  const m = meatOf(s, meatId);
  if (!m) return 'Unknown meat';
  if (qty <= 0) return 'Enter a quantity above zero';
  if (qty > m.stock + 1e-9) return 'Butchery only has ' + r3(m.stock) + ' kg of ' + m.name;
  const day = dayStr();
  const grams = s.settings.portionGrams || 250;
  const portions = portionsFromKg(grams, qty);
  if (m.kind === 'kg') ensureReadyDay(s, day);
  m.stock = r3(m.stock - qty);
  s.kitchen[meatId] = (s.kitchen[meatId] || 0) + portions;
  if (m.kind === 'kg') { const rd = readyDayOf(s, day, meatId); rd.received += portions; }
  s.transfers.push({ id: uid(), day, at: new Date().toISOString(), type: type || 'morning', meatId, name: m.name, qty, portions, by });
  return null;
}
function receiveMeat(s, meatId, qty, totalCost, supplierId, method, by) {
  const m = meatOf(s, meatId);
  if (totalCost > 0) m.cost = r2((m.stock * m.cost + totalCost) / (m.stock + qty));
  m.stock = r3(m.stock + qty);
  const day = dayStr();
  s.purchases.push({ id: uid(), day, at: new Date().toISOString(), kind: 'meat', itemId: m.id, name: m.name, qty, total: totalCost, supplierId: supplierId || null, method: method || 'cash', by });
  if (supplierId && method === 'credit' && totalCost > 0) { const sup = s.suppliers.find((x) => x.id === supplierId); if (sup) sup.balance = r2(sup.balance + totalCost); }
}
function recordWaste(s, o) {
  const m = meatOf(s, o.meatId);
  const have = stockAvail(s, o.loc, o.meatId);
  if (!(o.qty > 0)) return 'Enter a quantity above zero';
  if (o.qty > have + 1e-9) return 'Only ' + r3(have) + ' available to write off';
  applyDeducts(s, [{ loc: o.loc, id: o.meatId, qty: o.qty }], 1, dayStr());
  const grams = s.settings.portionGrams || 250;
  const cost = o.loc === 'kitchen' ? r2(o.qty * m.cost * (grams / 1000)) : r2(o.qty * m.cost);
  s.waste.push({ id: uid(), day: dayStr(), at: new Date().toISOString(), loc: o.loc, itemId: m.id, name: m.name, qty: o.qty, unit: o.loc === 'kitchen' ? 'portion' : m.kind, reason: o.reason, cost, by: o.by });
  return null;
}
// A physical count of ready-made portions differs from the running balance sometimes
// (prep loss, an uncounted sale, a mistake). Recording the count logs the difference
// and, if stock is short, writes it off as waste so it still hits the accounts.
function recordReadyClosing(s, meatId, counted, by) {
  const m = meatOf(s, meatId);
  const day = dayStr();
  const rd = readyDayOf(s, day, meatId);
  const have = s.kitchen[meatId] || 0;
  const variance = counted - have;
  const grams = s.settings.portionGrams || 250;
  if (variance < 0) {
    s.waste.push({ id: uid(), day, at: new Date().toISOString(), loc: 'kitchen', itemId: meatId, name: m.name, qty: -variance, unit: 'portion', reason: 'Stock count shortfall', cost: r2(-variance * m.cost * (grams / 1000)), by });
  }
  if (rd) { rd.variance += variance; rd.closing = counted; }
  s.kitchen[meatId] = counted;
}

/* ---------------- specials ---------------- */
function specialPrice(m, qty) {
  if (m.kind === 'bird') return (m.specialPortions && (qty === 1 ? m.specialPortions.full : qty === 0.5 ? m.specialPortions.half : Math.round(m.special * qty))) || 0;
  if (m.specialPortions && m.specialPortions[qty] !== undefined) return m.specialPortions[qty];
  return Math.round(m.special * qty);
}
function createSpecial(s, f, by) {
  const m = meatOf(s, f.meatId);
  if (!m) return { err: 'Pick a meat' };
  if (!(f.qty > 0)) return { err: 'Enter the quantity' };
  const dd = [{ loc: 'butchery', id: m.id, qty: f.qty }];
  const err = checkStock(s, dd);
  if (err) return { err };
  const day = dayStr();
  applyDeducts(s, dd, 1, day);
  const sides = f.sides.map((x) => { const sd = s.sides.find((y) => y.id === x.id); return { id: sd.id, name: sd.name, qty: x.qty, price: sd.price * x.qty, cost: (sd.cost || 0) * x.qty }; });
  const no = nextNo(s, 'special', day);
  const now = Date.now();
  const sp = {
    id: uid(), day, no, at: new Date(now).toISOString(), due: new Date(now + 60 * 60000).toISOString(),
    customer: (f.customer || '').trim(), phone: (f.phone || '').trim(),
    meatId: m.id, meat: m.name, unit: m.kind === 'bird' ? 'bird' : 'kg', qty: f.qty,
    style: (f.style || '').trim(), sides, instr: (f.instr || '').trim(), tableNo: f.tableNo || null,
    price: specialPrice(m, f.qty) + sum(sides, (x) => x.price),
    cost: r2(m.cost * f.qty + sum(sides, (x) => x.cost)),
    status: 'pending', paid: false, paidAmount: 0, cleared: false, by,
  };
  s.specials.push(sp);
  s.transfers.push({ id: uid(), day, at: sp.at, type: 'special', meatId: m.id, name: m.name, qty: f.qty, ref: sp.no, by });
  return { sp };
}
// Pay some or all of a special's price. amount === null pays in full. Each call issues its own
// sale/receipt (deposit, then balance later), so both the deposit and the final payment are on record.
function paySpecial(s, spId, pay, by, amount) {
  const sp = s.specials.find((x) => x.id === spId);
  if (!sp || sp.paid) return null;
  const due = r2(sp.price - (sp.paidAmount || 0));
  const amt = amount == null ? due : Math.min(r2(amount), due);
  if (!(amt > 0)) return null;
  const isFull = amt >= due - 0.5;
  const line = Object.assign({}, specialLine(sp), {
    name: (isFull && !sp.paidAmount ? '' : (sp.paidAmount ? 'Balance · ' : 'Deposit · ')) + specialLine(sp).name,
    total: amt, cost: r2(sp.cost * (amt / sp.price)),
  });
  const sale = createSale(s, { source: 'special', lines: [line], pay, cashier: by, tableNo: sp.tableNo, deduct: false, special: sp.id });
  sp.paidAmount = r2((sp.paidAmount || 0) + amt);
  sp.paid = sp.paidAmount >= sp.price - 0.5;
  sp.saleId = sale.id;
  return sale;
}

/* ---------------- table tabs (running bills) ---------------- */
function addToTab(s, no, line) {
  const err = checkStock(s, line.deduct || []);
  if (err) return { err };
  applyDeducts(s, line.deduct || [], 1, dayStr());
  const tab = s.tabs[no] || (s.tabs[no] = { lines: [], openedAt: new Date().toISOString() });
  tab.lines = addLineTo(tab.lines, line);
  return {};
}
function changeTabLine(s, no, key, delta) {
  const tab = s.tabs[no];
  if (!tab) return { err: 'Table is not open' };
  const l = tab.lines.find((x) => x.key === key);
  if (!l) return {};
  const newQty = l.kind === 'meat' ? 0 : r3(l.qty + delta);
  if (newQty <= 0) {
    applyDeducts(s, l.deduct || [], -1, dayStr());
    tab.lines = tab.lines.filter((x) => x.key !== key);
    return {};
  }
  if (delta > 0) {
    const unit = scaleLine(l, 1);
    const err = checkStock(s, (unit.deduct || []).map((d) => Object.assign({}, d, { qty: d.qty * delta })));
    if (err) return { err };
  }
  const nl = scaleLine(l, newQty);
  const diff = (l.deduct || []).map((d, i) => ({ loc: d.loc, id: d.id, qty: r3(nl.deduct[i].qty - d.qty) }));
  applyDeducts(s, diff, 1, dayStr());
  tab.lines = tab.lines.map((x) => (x.key === key ? nl : x));
  return {};
}
function tabLinked(s, no) { return s.specials.filter((x) => x.tableNo === no && !x.paid && !x.cleared); }
function tabTotal(s, no) {
  const tab = s.tabs[no];
  return sum(tab ? tab.lines : [], (l) => l.total) + sum(tabLinked(s, no), (x) => x.price);
}
function settleTab(s, no, pay, by) {
  const tab = s.tabs[no] || { lines: [] };
  const linked = tabLinked(s, no);
  const lines = tab.lines.concat(linked.map(specialLine));
  const sale = createSale(s, { source: 'table', lines, pay, cashier: by, tableNo: no, deduct: false });
  linked.forEach((sp) => { sp.paid = true; sp.paidAmount = sp.price; sp.saleId = sale.id; });
  delete s.tabs[no];
  return sale;
}

/* ---------------- consumables ---------------- */
function receiveCons(s, id, qty, totalCost, supplierId, method, by) {
  const c = consOf(s, id);
  const day = dayStr();
  ensureDay(s, day);
  if ((c.cat === 'drink' || c.cat === 'ingredient') && totalCost > 0) c.cost = r2((c.qty * c.cost + totalCost) / (c.qty + qty));
  c.qty = r3(c.qty + qty);
  consDay(s, day, id).received = r3(consDay(s, day, id).received + qty);
  s.purchases.push({ id: uid(), day, at: new Date().toISOString(), kind: 'cons', itemId: id, name: c.name, qty, total: totalCost, supplierId: supplierId || null, method: method || 'cash', by });
  if (supplierId && method === 'credit' && totalCost > 0) { const sup = s.suppliers.find((x) => x.id === supplierId); if (sup) sup.balance = r2(sup.balance + totalCost); }
}
function useCons(s, id, qty, by) {
  const c = consOf(s, id);
  if (qty > c.qty + 1e-9) return 'Only ' + r3(c.qty) + ' ' + c.unit + ' left';
  applyDeducts(s, [{ loc: 'cons', id, qty }], 1, dayStr());
  // Every manual issue is logged so it shows in the movement ledger. Only kitchen
  // ingredients carry a cost here: what the kitchen uses is part of the cost of the food.
  s.usage.push({ id: uid(), day: dayStr(), at: new Date().toISOString(), itemId: id, name: c.name, cat: c.cat, qty, unit: c.unit, cost: c.cat === 'ingredient' ? r2(qty * c.cost) : 0, by: by || '' });
  return null;
}
function recordClosing(s, id, counted, by) {
  const c = consOf(s, id);
  const day = dayStr();
  const cd = consDay(s, day, id);
  const variance = r3(counted - c.qty);
  if (variance < 0 && (c.cat === 'drink' || c.cat === 'ingredient') && c.cost > 0) {
    s.waste.push({ id: uid(), day, at: new Date().toISOString(), loc: 'cons', itemId: id, name: c.name, qty: -variance, unit: c.unit, reason: 'Stock count shortfall', cost: r2(-variance * c.cost), by });
  }
  cd.variance = r3(cd.variance + variance);
  cd.closing = counted;
  c.qty = counted;
}
const consLow = (s) => s.cons.filter((c) => c.active !== false && c.qty <= c.low);
const meatLow = (s) => s.meats.filter((m) => m.active !== false && m.stock <= m.low);

/* ---------------- suppliers ---------------- */
function addSupplier(s, name, phone) {
  const sup = { id: uid(), name: name.trim(), phone: (phone || '').trim(), balance: 0 };
  s.suppliers.push(sup);
  return sup;
}
function paySupplier(s, supplierId, amount, method, by) {
  const sup = s.suppliers.find((x) => x.id === supplierId);
  if (!sup) return 'Supplier not found';
  if (!(amount > 0)) return 'Enter an amount above zero';
  sup.balance = r2(sup.balance - amount);
  s.supplierPayments.push({ id: uid(), day: dayStr(), at: new Date().toISOString(), supplierId, name: sup.name, amount: r2(amount), method: method || 'Cash', by });
  logAudit(s, 'Supplier payment', sup.name + ' · ' + money(amount) + ' · ' + method, by);
  return null;
}

/* ---------------- employees, salaries & advances ---------------- */
function addEmployee(s, f) {
  const e = { id: uid(), name: f.name.trim(), role: (f.role || '').trim(), payType: f.payType, rate: num0(f.rate), active: true };
  s.employees.push(e);
  return e;
}
const num0 = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
function recordPayroll(s, f, by) {
  const e = s.employees.find((x) => x.id === f.employeeId);
  if (!e) return 'Pick an employee';
  if (!(f.amount > 0)) return 'Enter an amount above zero';
  s.payroll.push({ id: uid(), day: dayStr(), at: new Date().toISOString(), employeeId: e.id, name: e.name, type: f.type, amount: r2(f.amount), method: f.method || 'Cash', note: (f.note || '').trim(), by });
  logAudit(s, f.type === 'advance' ? 'Staff advance' : 'Salary payment', e.name + ' · ' + money(f.amount) + ' · ' + method_label(f.method), by);
  return null;
}
function method_label(m) { return m || 'Cash'; }

/* ---------------- cash reconciliation & bank deposits ---------------- */
function tillExpected(s, day, openingCash, openingMpesa) {
  // Sales money is counted on the day it was actually received (a credit sale paid
  // later lands on the day of payment), and voided sales never count.
  const received = [];
  s.sales.filter((x) => !x.voided).forEach((x) => salePayments(x).forEach((p) => { if (p.day === day) received.push(p); }));
  const cashIn = sum(received, (p) => p.cash || 0);
  const mpesaIn = sum(received, (p) => p.mpesa || 0);
  const out = (method) => ({
    purchases: sum(s.purchases.filter((x) => x.day === day && x.method === method), (x) => x.total || 0),
    expenses: sum(s.expenses.filter((x) => x.day === day && x.via === (method === 'cash' ? 'Cash' : 'M-Pesa')), (x) => x.amount || 0),
    supplier: sum(s.supplierPayments.filter((x) => x.day === day && x.method === (method === 'cash' ? 'Cash' : 'M-Pesa')), (x) => x.amount || 0),
    payroll: sum(s.payroll.filter((x) => x.day === day && x.method === (method === 'cash' ? 'Cash' : 'M-Pesa')), (x) => x.amount || 0),
  });
  const cOut = out('cash'), mOut = out('mpesa');
  const cashDeposits = sum(s.deposits.filter((x) => x.day === day && (x.method || 'cash') === 'cash'), (x) => x.amount || 0);
  const mpesaDeposits = sum(s.deposits.filter((x) => x.day === day && x.method === 'mpesa'), (x) => x.amount || 0);
  const cash = { salesIn: cashIn, purchasesOut: cOut.purchases, expensesOut: cOut.expenses, supplierOut: cOut.supplier, payrollOut: cOut.payroll, depositsOut: cashDeposits, expected: r2(openingCash + cashIn - cOut.purchases - cOut.expenses - cOut.supplier - cOut.payroll - cashDeposits) };
  const mpesa = { salesIn: mpesaIn, purchasesOut: mOut.purchases, expensesOut: mOut.expenses, supplierOut: mOut.supplier, payrollOut: mOut.payroll, depositsOut: mpesaDeposits, expected: r2((openingMpesa || 0) + mpesaIn - mOut.purchases - mOut.expenses - mOut.supplier - mOut.payroll - mpesaDeposits) };
  return { cash, mpesa };
}
function recordReconciliation(s, day, openingCash, countedCash, openingMpesa, countedMpesa, by) {
  const t = tillExpected(s, day, openingCash, openingMpesa);
  const r = {
    id: uid(), day, at: new Date().toISOString(), by,
    openingFloat: openingCash, expected: t.cash.expected, counted: countedCash, variance: r2(countedCash - t.cash.expected),
    openingMpesa: openingMpesa || 0, expectedMpesa: t.mpesa.expected, countedMpesa: countedMpesa === null || countedMpesa === undefined ? null : countedMpesa, varianceMpesa: countedMpesa === null || countedMpesa === undefined ? null : r2(countedMpesa - t.mpesa.expected),
  };
  s.reconciliations = s.reconciliations.filter((x) => x.day !== day);
  s.reconciliations.push(r);
  if (Math.abs(r.variance) > 0.5) logAudit(s, 'Cash count', dateNice(day) + ' · cash variance ' + money(r.variance), by);
  if (r.varianceMpesa !== null && Math.abs(r.varianceMpesa) > 0.5) logAudit(s, 'M-Pesa count', dateNice(day) + ' · M-Pesa variance ' + money(r.varianceMpesa), by);
  return r;
}
function recordDeposit(s, amount, ref, method, by) {
  if (!(amount > 0)) return 'Enter an amount above zero';
  s.deposits.push({ id: uid(), day: dayStr(), at: new Date().toISOString(), amount: r2(amount), method: method || 'cash', ref: (ref || '').trim(), by });
  logAudit(s, 'Bank deposit', money(amount) + ' · ' + (method === 'mpesa' ? 'M-Pesa' : 'Cash') + (ref ? ' · ' + ref : ''), by);
  return null;
}

/* ---------------- profit & loss (approximate) ---------------- */
function periodRange(p) {
  const t = new Date();
  const today = dayStr(t);
  const back = (n) => { const d = new Date(t); d.setDate(d.getDate() - n); return dayStr(d); };
  if (p === 'today') return [today, today];
  if (p === 'yesterday') return [back(1), back(1)];
  if (p === '7d') return [back(6), today];
  if (p === '30d') return [back(29), today];
  if (p === 'month') return [today.slice(0, 8) + '01', today];
  return [null, null];
}
const inRange = (day, from, to) => (!from || day >= from) && (!to || day <= to);
/* ---------------- central stock movement ledger ---------------- */
// Pulls together every stock-affecting event already recorded elsewhere —
// purchases, transfers, actual sale-line deductions, waste, and physical-count
// adjustments — into one chronological, filterable feed. Nothing here is
// re-derived or guessed: each row points back at the real record (a purchase,
// a transfer, a receipt, a waste entry) that caused it, so this can never
// drift out of sync with what Butchery/Kitchen/Consumables/Sales actually did.
const CAT_BUTCHERY = 'Meat · Butchery', CAT_READY = 'Meat · Ready-made', CAT_DRINKS = 'Drinks', CAT_INGREDIENT = 'Kitchen ingredients', CAT_SUPPLY = 'Consumables';
const consCat = (c) => (c && c.cat === 'drink' ? CAT_DRINKS : c && c.cat === 'ingredient' ? CAT_INGREDIENT : CAT_SUPPLY);
function movementLedger(s, from, to) {
  const rows = [];
  const push = (at, day, cat, item, dir, qty, unit, type, ref, by) => { if (inRange(day, from, to)) rows.push({ at, day, cat, item, dir, qty, unit, type, ref: ref || '', by: by || '' }); };

  s.purchases.forEach((p) => {
    if (p.kind === 'meat') push(p.at, p.day, CAT_BUTCHERY, p.name, 'in', p.qty, meatOf(s, p.itemId) && meatOf(s, p.itemId).kind === 'bird' ? 'bird' : 'kg', 'Purchase', p.supplierId ? (s.suppliers.find((x) => x.id === p.supplierId) || {}).name : '', p.by);
    else { const c = consOf(s, p.itemId); push(p.at, p.day, consCat(c), p.name, 'in', p.qty, c ? c.unit : 'pc', 'Purchase', p.supplierId ? (s.suppliers.find((x) => x.id === p.supplierId) || {}).name : '', p.by); }
  });
  s.transfers.forEach((t) => {
    const m = meatOf(s, t.meatId);
    if (t.type === 'special') push(t.at, t.day, CAT_BUTCHERY, t.name, 'out', t.qty, 'kg', 'Special order', t.ref ? '#' + t.ref : '', t.by);
    else {
      push(t.at, t.day, CAT_BUTCHERY, t.name, 'out', t.qty, 'kg', 'Transfer to kitchen', '', t.by);
      push(t.at, t.day, CAT_READY, t.name, 'in', t.portions || 0, 'portion', 'Transfer from butchery', '', t.by);
    }
  });
  s.sales.filter((x) => !x.voided).forEach((x) => {
    x.lines.forEach((l) => (l.deduct || []).forEach((d) => {
      if (d.loc === 'butchery') { const m = meatOf(s, d.id); if (m) push(x.at, x.day, CAT_BUTCHERY, m.name, 'out', d.qty, m.kind === 'bird' ? 'bird' : 'kg', 'Sale', receiptNo(x), x.cashier); }
      else if (d.loc === 'kitchen') { const m = meatOf(s, d.id); if (m) push(x.at, x.day, CAT_READY, m.name, 'out', d.qty, 'portion', 'Sale', receiptNo(x), x.cashier); }
      else if (d.loc === 'cons') { const c = consOf(s, d.id); if (c) push(x.at, x.day, consCat(c), c.name, 'out', d.qty, c.unit, 'Sale', receiptNo(x), x.cashier); }
    }));
  });
  (s.usage || []).forEach((u) => push(u.at, u.day, u.cat === 'drink' ? CAT_DRINKS : u.cat === 'ingredient' ? CAT_INGREDIENT : CAT_SUPPLY, u.name, 'out', u.qty, u.unit, u.cat === 'ingredient' ? 'Used in kitchen' : 'Issued for use', '', u.by));
  s.waste.forEach((w) => {
    const cat = w.loc === 'kitchen' ? CAT_READY : w.loc === 'cons' ? consCat(consOf(s, w.itemId)) : CAT_BUTCHERY;
    push(w.at, w.day, cat, w.name, 'out', w.qty, w.unit, w.reason === 'Stock count shortfall' ? 'Stock count' : 'Waste', w.reason, w.by);
  });
  Object.keys(s.consDays || {}).forEach((day) => {
    if (!inRange(day, from, to)) return;
    Object.keys(s.consDays[day]).forEach((id) => {
      const r = s.consDays[day][id]; const c = consOf(s, id);
      if (c && r.closing !== null && r.variance > 0) push(day + 'T12:00:00.000Z', day, consCat(c), c.name, 'in', r.variance, c.unit, 'Stock count', 'Physical count found extra', '');
    });
  });
  Object.keys(s.readyDays || {}).forEach((day) => {
    if (!inRange(day, from, to)) return;
    Object.keys(s.readyDays[day]).forEach((id) => {
      const r = s.readyDays[day][id]; const m = meatOf(s, id);
      if (m && r.closing !== null && r.variance > 0) push(day + 'T12:00:00.000Z', day, CAT_READY, m.name, 'in', r.variance, 'portion', 'Stock count', 'Physical count found extra', '');
    });
  });
  rows.sort((a, b) => b.at.localeCompare(a.at));
  return rows;
}

function computePL(s, from, to) {
  const ch = {};
  CHANNELS.forEach((c) => { ch[c.id] = { rev: 0, cogs: 0 }; });
  const pay = { cash: 0, mpesa: 0, card: 0 };
  const items = {};
  let count = 0, unpaidOutstanding = 0;
  // Revenue is recognised on a cash basis, on the day money is received: a part-paid
  // or credit sale contributes only what has been collected so far, dated when it arrived.
  s.sales.filter((x) => !x.voided).forEach((x) => {
    if (inRange(x.day, from, to)) { count++; unpaidOutstanding += x.balance || 0; }
    salePayments(x).forEach((p) => {
      if (!inRange(p.day, from, to)) return;
      const ratio = x.total > 0 ? Math.min(1, p.amount / x.total) : 1;
      x.lines.forEach((l) => {
        const c = ch[l.ch] || ch.side;
        c.rev += l.total * ratio; c.cogs += (l.cost || 0) * ratio;
        items[l.name] = (items[l.name] || 0) + l.total * ratio;
      });
      pay.cash += p.cash || 0; pay.mpesa += p.mpesa || 0; pay.card += p.card || 0;
    });
  });
  const rev = sum(CHANNELS, (c) => ch[c.id].rev);
  const cogsSold = sum(CHANNELS, (c) => ch[c.id].cogs);
  const shrink = sum(s.waste.filter((w) => inRange(w.day, from, to)), (w) => w.cost || 0);
  const ingredients = sum((s.usage || []).filter((u) => u.cat === 'ingredient' && inRange(u.day, from, to)), (u) => u.cost || 0);
  const cogs = cogsSold + shrink + ingredients;
  const gross = rev - cogs;
  const byCat = {};
  s.expenses.filter((e) => inRange(e.day, from, to)).forEach((e) => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const staffCost = sum(s.payroll.filter((p) => inRange(p.day, from, to)), (p) => p.amount);
  if (staffCost) byCat['Salaries & advances'] = r2((byCat['Salaries & advances'] || 0) + staffCost);
  const opex = sum(Object.keys(byCat), (k) => byCat[k]);
  const net = gross - opex;
  return { ch, count, pay, items, rev: r2(rev), cogsSold: r2(cogsSold), shrink: r2(shrink), ingredients: r2(ingredients), cogs: r2(cogs), gross: r2(gross), gm: rev ? gross / rev : 0, byCat, opex, net, nm: rev ? net / rev : 0, unpaidOutstanding: r2(unpaidOutstanding) };
}

/* ---------------- persistence (server-backed) ---------------- */
// The browser talks to this machine's own local server (see server.js),
// which is the one writing to SQLite. No internet involved — the server
// listens on localhost only.
let _saveTimer = null, _pending = null, _saving = false;
async function apiLoadState() {
  const r = await fetch('/api/state');
  if (!r.ok) throw new Error('Could not load data from the local server (status ' + r.status + ')');
  return await r.json();
}
async function flushSave() {
  if (!_pending || _saving) return;
  const body = _pending; _pending = null; _saving = true;
  try {
    const r = await fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('save failed: ' + r.status);
  } catch (e) {
    console.error('SmartPOS: could not save to the local server', e);
    window.__smartposSaveError = true;
  } finally {
    _saving = false;
    if (_pending) flushSave();
  }
}
function saveState(s) { _pending = s; clearTimeout(_saveTimer); _saveTimer = setTimeout(flushSave, 250); }

const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

function useNow(ms) {
  const [n, setN] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setN(Date.now()), ms || 30000); return () => clearInterval(t); }, [ms]);
  return n;
}

/* ---------------- sound feedback (Web Audio, no files, fully offline) ---------------- */
let _audioCtx = null;
function beep(freq, ms, vol) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    const t0 = _audioCtx.currentTime;
    const osc = _audioCtx.createOscillator();
    const gain = _audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.06, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
    osc.connect(gain); gain.connect(_audioCtx.destination);
    osc.start(t0); osc.stop(t0 + ms / 1000);
  } catch (e) { /* audio unavailable — fail silently */ }
}
const SOUND = { ok: () => beep(720, 90), err: () => beep(220, 160, 0.08), click: () => beep(520, 40, 0.035) };

/* ---------------- small shared components ---------------- */
const MODAL_STACK = [];
function Modal({ title, onClose, size, children, footer }) {
  const idRef = useRef({});
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const id = idRef.current;
    MODAL_STACK.push(id);
    const h = (e) => { if (e.key === 'Escape' && MODAL_STACK[MODAL_STACK.length - 1] === id && closeRef.current) closeRef.current(); };
    window.addEventListener('keydown', h);
    return () => { window.removeEventListener('keydown', h); const i = MODAL_STACK.indexOf(id); if (i >= 0) MODAL_STACK.splice(i, 1); };
  }, []);
  return html`<div className="modal-overlay" onMouseDown=${(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
    <div className=${'modal ' + (size || '')} role="dialog" aria-label=${title}>
      <div className="modal-head"><h3>${title}</h3><button className="icon-btn" onClick=${onClose} aria-label="Close">✕</button></div>
      <div className="modal-body">${children}</div>
      ${footer ? html`<div className="modal-foot">${footer}</div>` : null}

}
function Tabs({ tabs, value, onChange }) {
  return html`<div className="tabs" role="tablist">${tabs.map((t) => html`<button key=${t.id} role="tab" aria-selected=${value === t.id} className=${'tab' + (value === t.id ? ' active' : '')} onClick=${() => onChange(t.id)}>${t.label}${t.badge ? html`<span className="bdg">${t.badge}</span>` : null}</button>`)}</div>`;
}
function Field({ label, sub, children }) {
  return html`<div className="field"><label>${label}</label>${children}${sub ? html`<span className="sub">${sub}</span>` : null}</div>`;
}
function NumInput({ value, onCommit, step, min, width, placeholder, disabled }) {
  const [v, setV] = useState(String(value == null ? '' : value));
  useEffect(() => { setV(String(value == null ? '' : value)); }, [value]);
  const mn = min == null ? 0 : min;
  const commit = () => {
    const n = parseFloat(v);
    if (isNaN(n) || n < mn) { setV(String(value == null ? '' : value)); return; }
    if (n !== value) onCommit(n);
  };
  return html`<input className="inp num" type="number" inputMode="decimal" step=${step || 'any'} min=${mn} value=${v} placeholder=${placeholder} disabled=${disabled}
    style=${width ? { width: width } : null} onChange=${(e) => setV(e.target.value)} onBlur=${commit} onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); }} />`;
}
function TextInput({ value, onCommit, placeholder, width }) {
  const [v, setV] = useState(value || '');
  useEffect(() => { setV(value || ''); }, [value]);
  const commit = () => { const t = v.trim(); if (!t) { setV(value || ''); return; } if (t !== value) onCommit(t); };
  return html`<input className="inp" type="text" value=${v} placeholder=${placeholder} style=${width ? { width: width } : null}
    onChange=${(e) => setV(e.target.value)} onBlur=${commit} onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); }} />`;
}
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

/* ---------------- checkout (payment) ---------------- */
function CheckoutModal({ title, total, print, onClose, onConfirm, allowUnpaid, unpaidLabel, creditCustomer }) {
  const [method, setMethod] = useState('cash');
  const [tendered, setTendered] = useState(String(total));
  const [cashPart, setCashPart] = useState('');
  const [ref, setRef] = useState('');
  const [credit, setCredit] = useState(false);
  const [custName, setCustName] = useState('');
  const [custPhone, setCustPhone] = useState('');
  const t = num(tendered), cp = num(cashPart);
  const change = Math.max(0, t - total);
  let valid = true, msg = '';
  if (method === 'cash' && t < total) { valid = false; msg = 'Cash received is less than the total.'; }
  if (method === 'split' && (cp <= 0 || cp >= total)) { valid = false; msg = 'Enter the cash part: more than 0 and less than the total.'; }
  const build = () => {
    if (method === 'cash') return { method: 'cash', cash: total, tendered: t, change };
    if (method === 'mpesa') return { method: 'mpesa', mpesa: total, ref };
    if (method === 'card') return { method: 'card', card: total, ref };
    return { method: 'split', cash: cp, mpesa: total - cp, ref };
  };
  const go = (doPrint) => { if (valid) onConfirm(build(), doPrint); };
  const goCredit = () => { if (!custName.trim()) return; onConfirm(null, true, { name: custName.trim(), phone: custPhone.trim() }); };
  const quick = Array.from(new Set([total, Math.ceil(total / 100) * 100, Math.ceil(total / 500) * 500, Math.ceil(total / 1000) * 1000])).filter((x) => x >= total).sort((a, b) => a - b);
  const methods = [['cash', 'Cash'], ['mpesa', 'M-Pesa'], ['card', 'Card'], ['split', 'Cash + M-Pesa']];
  const footer = credit ? html`
    <button className="btn ghost" onClick=${() => setCredit(false)}>Back</button>
    <button className="btn" disabled=${!custName.trim()} onClick=${goCredit}>Sell on credit & print receipt</button>`
  : html`
    ${creditCustomer ? html`<button className="btn ghost" onClick=${() => setCredit(true)}>Sell on credit</button>` : null}
    ${allowUnpaid ? html`<button className="btn ghost" onClick=${() => onConfirm(null, true)}>${unpaidLabel || 'Leave unpaid & print receipt'}</button>` : null}
    ${print === 'ask' ? html`<button className="btn ghost" disabled=${!valid} onClick=${() => go(false)}>Confirm, don't print</button>` : null}
    <button className="btn" disabled=${!valid} onClick=${() => go(print !== 'none')}>${print === 'none' ? 'Confirm payment' : 'Confirm & print receipt'}</button>`;
  if (credit) return html`<${Modal} title=${'Sell on credit' + (title ? ' · ' + title : '')} onClose=${onClose} footer=${footer}>
    <div className="total-row" style=${{ paddingTop: 0 }}><span className="sec">Amount owed</span><b>${money(total)}</b></div>
    <p className="hint">The goods leave stock now; the customer pays later. Recorded under Debtors until cleared.</p>
    <${Field} label="Customer name (required)"><input className="inp" value=${custName} onChange=${(e) => setCustName(e.target.value)} autoFocus /><//>
    <div className="mt"><${Field} label="Phone number (optional)"><input className="inp" type="tel" value=${custPhone} onChange=${(e) => setCustPhone(e.target.value)} /><//></div>
  <//>`;
  return html`<${Modal} title=${title || 'Take payment'} onClose=${onClose} footer=${footer}>
    <div className="total-row" style=${{ paddingTop: 0 }}><span className="sec">Amount due</span><b>${money(total)}</b></div>
    <div className="chips mb">${methods.map((m) => html`<button key=${m[0]} className=${'chip' + (method === m[0] ? ' on' : '')} onClick=${() => setMethod(m[0])}>${m[1]}</button>`)}</div>
    ${method === 'cash' ? html`<div className="col">
      <${Field} label="Cash received"><input className="inp num" type="number" inputMode="decimal" value=${tendered} onChange=${(e) => setTendered(e.target.value)} /><//>
      <div className="chips">${quick.map((q) => html`<button key=${q} className="chip" onClick=${() => setTendered(String(q))}>${q === total ? 'Exact' : money(q)}</button>`)}</div>
      <div className="row between"><span className="sec">Change to give</span><b className="num-strong">${money(change)}</b></div>
    </div>` : null}
    ${method === 'mpesa' || method === 'card' ? html`<${Field} label=${method === 'mpesa' ? 'M-Pesa transaction code (optional)' : 'Card slip / reference (optional)'}><input className="inp" value=${ref} onChange=${(e) => setRef(e.target.value)} /><//>` : null}
    ${method === 'split' ? html`<div className="col">
      <${Field} label="Cash part" sub=${cp > 0 && cp < total ? 'M-Pesa part: ' + money(total - cp) : 'The rest is paid by M-Pesa'}><input className="inp num" type="number" inputMode="decimal" value=${cashPart} onChange=${(e) => setCashPart(e.target.value)} /><//>
      <${Field} label="M-Pesa transaction code (optional)"><input className="inp" value=${ref} onChange=${(e) => setRef(e.target.value)} /><//>
    </div>` : null}
    ${msg ? html`<p className="err-msg mt">${msg}</p>` : null}
  <//>`;
}
